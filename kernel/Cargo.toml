[package]
name = "bmo-kernel"
version = "2.0.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO kernel — pure Ring 0 (arch, mm, dev, cpu, proc)"
license = "Techne"

[dependencies]
bmo-boot-protocol = { path = "Boot_Protocol" }
cpu-vendor-profile = { path = "../crates_Personal/ring0/cpu_vendor_profile" }
nvram-log = { path = "../Uso_Reales_Crates/shared/nvram-log" }
bmo-hal = { path = "../Uso_Reales_Crates/shared/bmo-hal" }
bmo-channel = { path = "../Uso_Reales_Crates/shared/bmo-channel" }
llfree = { path = "../crates_Personal/plugins/llfree", optional = true }
volatile = "0.4"
bitflags = "2"
spin = "0.9"

[features]
default = ["alloc-buddy", "syscalls-base"]
alloc-buddy = []
alloc-llfree = ["llfree"]
syscalls-base = []
syscalls-net = []
syscalls-gpu = []
syscalls-ipc = []
syscalls-audio = []
    
[[bin]]
name =     "bmo-kernel"
path = "src/main.rs"
