[package]
name = "fastos-kernel"
version = "1.8.16"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS kernel - UEFI GOP framebuffer + BMO/BareX"
license = "Techne"

[dependencies]
bmo-abi = { path = "../crates_Personal/bmo_abi" }
bmo-audio = { path = "../crates_Personal/bmo_audio" }
fastos-boot-protocol = { path = "../crates_Personal/boot_protocol" }
nvram-log = { path = "../crates_Personal/nvram-log" }
vendor = { path = "../crates_Personal/vendor" }
cabina-core = { path = "../crates_Personal/cabina/core" }
cabina-daemon = { path = "../crates_Personal/cabina/daemon" }
cabina-panels = { path = "../crates_Personal/cabina/panels" }
bmo-devour-pe = { path = "../crates_Personal/bmo_devour_pe" }
bmo-devour-elf = { path = "../crates_Personal/bmo_devour_elf" }
llfree = { path = "../crates_Personal/llfree-rs/core", optional = true }
volatile = "0.4"
bitflags = "2"

[features]
default = ["alloc-buddy"]
alloc-buddy = []
alloc-llfree = ["llfree"]
    
[[bin]]
name = "fastos-kernel"
path = "src/ring0/mod.rs"

# Linker configuration for x86_64-unknown-none target.
