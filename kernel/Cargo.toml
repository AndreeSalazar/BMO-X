[package]
name = "fastos-kernel"
version = "1.8.16"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS kernel - UEFI GOP framebuffer + BMO/BareX"
license = "Techne"

[dependencies]
bmo-abi = { path = "../crates_Personal/bmo_abi" }
bmo-audio = { path = "../crates_Personal/bmo_audio" }
fastos-boot-protocol = { path = "../crates_Personal/boot_protocol" }
nvram-log = { path = "../crates_Personal/nvram-log" }
vendor = { path = "../crates_Personal/vendor" }
volatile = "0.4"
bitflags = "2"
    
[[bin]]
name = "fastos-kernel"
path = "src/ring0/mod.rs"

# Linker configuration for x86_64-unknown-none target.
