[package]
name = "fastos-kernel"
version = "0.1.0"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS kernel — Ryzen 5 5600X + RTX 3060 12G"
license = "MIT"

[dependencies]
fastos-boot-protocol = { path = "../boot_protocol" }
ntfs = { version = "0.4", default-features = false }
nt-hive = { version = "0.3.0", default-features = false }
binrw = { version = "0.11", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[[bin]]
name = "fastos-kernel"
path = "src/main.rs"

# Linker configuration for x86_64-unknown-none target
