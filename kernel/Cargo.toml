[package]
name = "fastos-kernel"
version = "1.7.16"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS kernel - UEFI GOP framebuffer + BMO/BareX"
license = "Techne"

[dependencies]
fastos-boot-protocol = { path = "../boot_protocol" }
volatile = "0.4"
bitflags = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[[bin]]
name = "fastos-kernel"
path = "src/ring0/mod.rs"

# Linker configuration for x86_64-unknown-none target.
