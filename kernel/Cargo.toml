[package]
name = "fastos-kernel"
version = "0.9.0"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS kernel — Ryzen 5 5600X + RTX 3060 12G"
license = "Techne"

[dependencies]
fastos-boot-protocol = { path = "../boot_protocol" }
# El kernel queda slim: sólo deps que el código usa hoy.
#  - volatile  → escrituras MMIO (fb / mmio fastgpu)
#  - bitflags  → Capability flags del sandbox
# Las antiguas dependencias NTFS/hive/binrw/byteorder se removieron
# junto con el módulo `fs/` (no se usa fuera del extractor abandonado).
volatile = "0.4"
bitflags = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[[bin]]
name = "fastos-kernel"
path = "src/main.rs"

# Linker configuration for x86_64-unknown-none target
