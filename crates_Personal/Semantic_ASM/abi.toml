# Semantic_ASM ABI convention — neutral (architecture-independent)
#
# Architecture-specific details (registers, syscall instruction, stack layout)
# are in arch/<target>/abi.toml. Frontends load the root abi.toml first,
# then the arch-specific file for the target they are compiling to.

[data_model]
# Pointer size in bytes
pointer_size = 8
# Byte order
endianness = "little"
# Minimum alignment for any type
min_alignment = 1
# Maximum alignment for any type
max_alignment = 16
# Char signed by default
char_is_signed = true

[type_sizes]
# Default sizes for fundamental types (in bytes) — architecture neutral
void = 0
char = 1
short = 2
int = 4
long = 8
long_long = 8
float = 4
double = 8
pointer = 8
