# Semantic_ASM type definitions
# Base types that all frontends (C, COBOL, Rust) reference.
# Format: name = "underlying_type"
# When the compiler encounters `use "bmo/types"`, these type aliases become available.

# Stdint equivalents
size_t = "u64"
ssize_t = "i64"
intptr_t = "i64"
uintptr_t = "u64"
uint8_t = "u8"
uint16_t = "u16"
uint32_t = "u32"
uint64_t = "u64"
int8_t = "i8"
int16_t = "i16"
int32_t = "i32"
int64_t = "i64"

# POSIX-ish
pid_t = "i32"
uid_t = "u32"
gid_t = "u32"
mode_t = "u32"
off_t = "i64"
dev_t = "u64"
ino_t = "u64"
nlink_t = "u64"
blksize_t = "i64"
blkcnt_t = "i64"
time_t = "i64"

# BMO-specific handles
BmoHandle = "u64"
BmoStatus = "u64"
BmoSlice = "u64"  # pointer to slice descriptor
BmoStr = "u64"    # pointer to string descriptor

# Constants
NULL = 0
BMO_API_BASE = 0x100
BMO_API_END = 0x1FF
