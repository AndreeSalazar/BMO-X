# C89 (ANSI C) — ISO/IEC 9899:1990
# Committee: X3J11 (ANSI) + ISO JTC1/SC22/WG14
# Adopted: 1989-12-14 (ANSI), 1990 (ISO)

[standard]
name = "C89"
iso = "9899:1990"
year = 1989

[features]
function_prototypes = true
void_type = true
structs = true
unions = true
enums = true
typedefs = true
pointers = true
arrays = true
const = true
volatile = true

preprocessor = true
# Missing in original C89: inline, restrict, // comments, long long
inline = false
restrict = false
long_long = false

[types]
void = true
char = true
short = true
int = true
long = true
float = true
double = true
unsigned = true
signed = true

[comments]
block = true   # /* ... */
line = false    # // not in C89

[license]
text = "Public Domain — ISO standard"
