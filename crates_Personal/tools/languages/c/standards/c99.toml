# C99 — ISO/IEC 9899:1999
# Committee: ISO JTC1/SC22/WG14
# Adopted: 1999-12-01

[standard]
name = "C99"
iso = "9899:1999"
year = 1999

[features]
function_prototypes = true
void_type = true
structs = true
unions = true
enums = true
typedefs = true
pointers = true
arrays = true
const = true
volatile = true

preprocessor = true
inline = true
restrict = true
long_long = true

# C99 additions
variable_length_arrays = false  # not yet implemented
complex_numbers = false
designated_initializers = false
flexible_array_members = false
compound_literals = false
mixed_declarations = false
universal_character_names = false

[comments]
block = true
line = true  # // added in C99

[types]
void = true
char = true
short = true
int = true
long = true
long_long = true
float = true
double = true
unsigned = true
signed = true
_Bool = true
_Complex = false

[license]
text = "Public Domain — ISO standard"
