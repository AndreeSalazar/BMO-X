[workspace]
resolver = "2"
members = [
    # ── ULTRA KERNEL x86-64 (Ring 0 base + 12-stage faggin chain) ───
    # CPU-specific kernel. For ARM/RISC-V ports see Ultra_kernel_<arch>/.
    "Ultra_kernel_x86-64/boot_context",
    "Ultra_kernel_x86-64/kernel",

    # ── SHARED (Ring 0 + Ring 3) ────────────────────────────────────
    # El unico BLAKE3 del sistema: firmas del BEF, bmo-verify y ESTRATOS
    # calculan la MISMA suma porque ejecutan el MISMO codigo.
    "platform/shared/bmo-hash",
    "platform/shared/bmo-channel",

    # ── ABI (Foundation) ────────────────────────────────────────────
    "platform/abi/bmo-abi",

    # ── USERSPACE (Ring 3, x86-64) ─────────────────────────────────
    # NO va aquí, y es a propósito. `Ultra_userspace/` es su propio
    # workspace porque sus crates se compilan a `x86_64-unknown-none`
    # con SU guion de enlazado (userland/link.ld), que fija la base en
    # USER_IMAGE_BASE. Meterlos aquí obligaría a este workspace —lleno de
    # herramientas de build que corren en Windows— a cargar con esos
    # rustflags. Se construye desde `Ultra_userspace/` y el `.bex` sale
    # por `bex-link`.

    # ── DRIVERS (Hardware) ───────────────────────────────────────────
    "platform/drivers/audio",
    "platform/drivers/net",
    # El contrato de bloques (leer/escribir/capacidad/identidad). Paso 3 del
    # orden de construcción de ESTRATOS: lo de arriba habla con esto, no con SATA.
    "platform/drivers/storage/block",
    "platform/drivers/storage/ahci",
    "platform/drivers/storage/fat32",
    # ESTRATOS: el formato en disco del FS propio. Solo el FORMATO — sin E/S,
    # para poder probarlo entero en el anfitrion antes de tocar un sector.
    "platform/drivers/storage/estratos",
    "platform/drivers/usb/input",
    "platform/drivers/usb/uhid",
    "platform/drivers/usb/xhci",
    # GPU profiles (Ring 3 servers; reserved until hardware is on the bench)
    "platform/drivers/gpu/rdna4",

    # ── SERVICES (System) ──────────────────────────────────────────
    "platform/services/cabina-core",

    # ── BORRADOS el 2026-08-02, por decision del dueno ──────────────
    #
    # Seis librerias sin un solo dependiente, todas compilando y ninguna
    # cableada. La regla de esta casa es "cablear o borrar", y llevaban desde
    # julio sin moverse. El diseno de cada una vive en el commit que las quita;
    # git no olvida y el arbol deja de mentir sobre lo que hay montado.
    #
    #   timeback (1649)       ESTRATOS hace su trabajo: copy-on-write donde
    #                         escribir ES commitear, y ya monta y escribe
    #   byte-defender (577)   las capabilities cubren el modelo declarado
    #                         (cero-confianza en el CODIGO) y la firma BLAKE3
    #                         cubre la admision. Sus tests ni compilaban
    #   nvme (402)            el UNICO NVMe de este banco es el disco de
    #                         Windows del dueno, que no se toca jamas
    #   bmo-hal (290)         una tabla de punteros a funcion Ring 0 -> Ring 3
    #                         para un sistema donde Ring 3 habla por
    #                         CAPABILITIES. `bmo-abi` ya es ese contrato
    #   nvram-log (275)       el log por variables UEFI dio un falso positivo
    #                         y no se volvio a usar. CABINA + el anillo del
    #                         klog cubren el diagnostico
    #   hw-profile (181)      la maquina ya esta perfilada en
    #                         `cpu_vendor/ryzen_5_5600x`

    # ── PLUGINS (Vendored third-party) ──────────────────────────────
    # Removed: crates_Personal/plugins/* were legacy and have been
    # deleted. The bmo-elf (from goblin) and other plugin needs
    # are now sourced from crates.io where possible.

    # ── TOOLCHAIN (Build-time: language frontends → BEF → BEX) ─────
    # Ada: crate PROPIO y sin dependencia de los demás frontends. Cada
    # lenguaje es un pipeline individual y completo — lo único compartido son
    # contratos (BEF, los 3 syscalls) y librerías opcionales (bmo-lower).
    "toolchain/lang/ada",
    "toolchain/lang/cobol",
    "toolchain/lang/cpp",
    "toolchain/lang/c",
    # ── LA LIBC, junto a los lenguajes que la consumen ──────────────
    #
    # `lang/base/` ya era la biblioteca base: ahí viven los módulos en C
    # (`lib/printf`, `bmo/core`, `bmo/pci`) que el sistema de módulos del
    # frontend enlaza. `bmo-rt` es **la otra mitad de eso, en Rust**: lo que
    # exporta símbolos con nombre C para que un `.bex` los enlace.
    #
    # Estaba en `platform/abi/`, y eso era un error de categoría: `abi/` guarda
    # CONTRATOS —lo que dos partes acuerdan— y una libc es una
    # IMPLEMENTACIÓN. Tenerla ahí hacía que `abi/` significara dos cosas, y la
    # ponía lejos de la mitad en C con la que tiene que crecer a la vez.
    "toolchain/lang/base/bmo-rt",
    # ── TOOLS (generadores build-time) ─────────────────────────────
    "toolchain/tools/bef-bootstrap",
    "toolchain/tools/hello-bex",
    "toolchain/tools/fontgen",
    # Formatea un volumen ESTRATOS desde el anfitrion (paso 4c del diseno).
    "toolchain/tools/estratos-fmt",
    # El eslabon Rust -> .bex: sin el, Ultra_userspace/ no puede producir
    # nada que el kernel admita, y por eso llevaba meses lleno de stubs.
    "toolchain/tools/bex-link",
    # El par cliente/servidor que prueba Endpoint RPC en Ring 3.
    "toolchain/tools/rpc-demo",

    # ── FORGE (pipeline de compilación) ─────────────────────────────
    # Librerías OPCIONALES que cada frontend elige enlazar (nunca embudos).
    # Ver toolchain/forge/README.md y toolchain/lang/cobol/cobol.md.
    # sem-asm: encoder tabla→bytes (lo usa el codegen de C).
    # bmo-verify: gate que valida el BEF (delega al validador de bmo-abi).
    # bmo-lower/bmo-opt: se recrearán CON código real al empezar su fase.
    "toolchain/forge/sem-asm",
    "toolchain/forge/bmo-verify",
    # bmo-mods: el contrato de las tablas y los manifiestos. Un solo formato
    # y un solo descubrimiento, donde antes habia tres lectores hechos a mano.
    "toolchain/forge/bmo-mods",
    # bmo-lower: L1, el descenso genérico al ABI (la puerta INVOKE).
    "toolchain/forge/bmo-lower",

    # ── Nota sobre el intermediario "CPU-aware" ───────────────────
    # Aqui vivia `bmo-arch`: 1147 lineas de capa de abstraccion de CPU
    # con CERO usuarios, que ademas abstraia un `syscall(nr, [u64;6])`
    # que la superficie congelada de 3 syscalls no tiene. Se borro
    # (regla: o funciona, o se elimina y el diseno queda en un README).
    # El plan de portado vive en `platform/README.md`, y quien de
    # verdad separa CPU de contrato es la pareja
    # `Ultra_kernel_<arch>/` + `platform/`.
]

exclude = [
    # Extern submodule with its own Cargo workspace
    "extern/gnucobol-rs",

    # Sub-workspace (has its own [workspace] because build.ps1
    # Push-Locations into this directory to build the EFI binary;
    # see /Ultra_kernel_x86-64/uefi_chain/Cargo.toml).
    "Ultra_kernel_x86-64/uefi_chain",

    # Ring 3. Workspace propio por la misma razon: se compila a
    # x86_64-unknown-none con userland/link.ld, que fija la base en
    # USER_IMAGE_BASE. Ver Ultra_userspace/README.md.
    "Ultra_userspace",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
