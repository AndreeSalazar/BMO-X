[workspace]
resolver = "2"
members = [
    # ── RING 0 (Kernel) ──────────────────────────────────────────────
    "kernel",
    "kernel/Layer_Nano-Wake",
    "kernel/Boot_Protocol",
    "crates_Personal/bootloader",
    "crates_Personal/ring0/cpu_vendor_profile",
    "crates_Personal/ring0/cabina_daemon",
    "crates_Personal/ring0/cabina_panels",

    # ── SHARED (Ring 0 + Ring 3) ────────────────────────────────────
    "Uso_Reales_Crates/shared/bmo-hal",
    "Uso_Reales_Crates/shared/hw-profile",
    "Uso_Reales_Crates/shared/nvram-log",
    "Uso_Reales_Crates/shared/bmo-channel",

    # ── ABI (Foundation) ────────────────────────────────────────────
    "Uso_Reales_Crates/abi/bmo-abi",
    "Uso_Reales_Crates/abi/bmo-rt",

    # ── SERVICES (System) ──────────────────────────────────────────
    "Uso_Reales_Crates/services/cabina-core",
    "Uso_Reales_Crates/services/byte-defender",
    "Uso_Reales_Crates/services/timeback",

    # ── RING 3 (Userspace - Desktop) ───────────────────────────────
    "crates_Personal/desktop/bmo_core",

    # ── RING 3 (Kernel - Userspace support) ────────────────────────
    "kernel/ring3/foundation",
    "kernel/ring3/drivers/kbd",
    "kernel/ring3/drivers/mouse",
    "kernel/ring3/drivers/audio",
    "kernel/ring3/services/input",
    "kernel/ring3/services/audio",
    "kernel/ring3/services/fs",

    # ── DRIVERS (Hardware) ───────────────────────────────────────────
    "crates_Personal/drivers/audio/audio",
    "crates_Personal/drivers/usb/input",
    "crates_Personal/drivers/usb/xhci",
    "crates_Personal/drivers/usb/uhid",
    "crates_Personal/drivers/storage/ahci",
    "crates_Personal/drivers/storage/fat32",
    "crates_Personal/drivers/storage/nvme",
    "crates_Personal/drivers/net/net",

    # ── MODULES (Ring 3 loadable) ───────────────────────────────────
    "crates_Personal/modules/bmo_core",
    "crates_Personal/modules/timeback",
    "crates_Personal/modules/cabina",

    # ── PLUGINS (Third-party / vendored) ────────────────────────────
    "crates_Personal/plugins/goblin",
    "crates_Personal/plugins/llfree",
    "crates_Personal/plugins/llfree-eval",
    "crates_Personal/plugins/vendor",

    # ── TOOLS (Build-time) ──────────────────────────────────────────
    "crates_Personal/tools/languages/cobol",
    "crates_Personal/tools/languages/cpp",
    "crates_Personal/tools/languages/c",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

[profile.release.package.layer-nano-wake]
opt-level = "z"
