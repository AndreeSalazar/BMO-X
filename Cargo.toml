[workspace]
resolver = "2"
members = [
    "kernel",
    "crates_Personal/bootloader",
    "crates_Personal/boot_protocol",
    "crates_Personal/bmo_abi",
    "crates_Personal/bmo_audio",
    "crates_Personal/usb-log",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
