[workspace]
resolver = "2"
members = [
    # ── ULTRA KERNEL x86-64 (Ring 0 base + 12-stage faggin chain) ───
    # CPU-specific kernel. For ARM/RISC-V ports see Ultra_kernel_<arch>/.
    "Ultra_kernel_x86-64/boot_context",
    "Ultra_kernel_x86-64/kernel",

    # ── SHARED (Ring 0 + Ring 3) ────────────────────────────────────
    # El unico BLAKE3 del sistema: firmas del BEF, bmo-verify y ESTRATOS
    # calculan la MISMA suma porque ejecutan el MISMO codigo.
    "platform/shared/bmo-hash",
    "platform/shared/bmo-hal",
    "platform/shared/hw-profile",
    "platform/shared/nvram-log",
    "platform/shared/bmo-channel",

    # ── ABI (Foundation) ────────────────────────────────────────────
    "platform/abi/bmo-abi",
    "platform/abi/bmo-rt",

    # ── USERSPACE (Ring 3 side, x86-64) ────────────────────────────
    # Sibling of Ultra_kernel_x86-64/, NOT inside it. The whole
    # workspace builds as `cargo check --workspace` from FastOS/.
    "Ultra_userspace/userland",
    "Ultra_userspace/services/gui",
    "Ultra_userspace/services/input",
    "Ultra_userspace/apps/launcher",
    "Ultra_userspace/apps/terminal",

    # ── DRIVERS (Hardware) ───────────────────────────────────────────
    "platform/drivers/audio",
    "platform/drivers/net",
    # El contrato de bloques (leer/escribir/capacidad/identidad). Paso 3 del
    # orden de construcción de ESTRATOS: lo de arriba habla con esto, no con SATA.
    "platform/drivers/storage/block",
    "platform/drivers/storage/ahci",
    "platform/drivers/storage/fat32",
    # ESTRATOS: el formato en disco del FS propio. Solo el FORMATO — sin E/S,
    # para poder probarlo entero en el anfitrion antes de tocar un sector.
    "platform/drivers/storage/estratos",
    "platform/drivers/storage/nvme",
    "platform/drivers/usb/input",
    "platform/drivers/usb/uhid",
    "platform/drivers/usb/xhci",
    # GPU profiles (Ring 3 servers; reserved until hardware is on the bench)
    "platform/drivers/gpu/rdna4",

    # ── SERVICES (System) ──────────────────────────────────────────
    "platform/services/cabina-core",
    "platform/services/byte-defender",
    "platform/services/timeback",

    # ── PLUGINS (Vendored third-party) ──────────────────────────────
    # Removed: crates_Personal/plugins/* were legacy and have been
    # deleted. The bmo-elf (from goblin) and other plugin needs
    # are now sourced from crates.io where possible.

    # ── TOOLCHAIN (Build-time: language frontends → BEF → BEX) ─────
    "toolchain/lang/cobol",
    "toolchain/lang/cpp",
    "toolchain/lang/c",
    # ── TOOLS (generadores build-time) ─────────────────────────────
    "toolchain/tools/bef-bootstrap",
    "toolchain/tools/hello-bex",
    "toolchain/tools/fontgen",
    # Formatea un volumen ESTRATOS desde el anfitrion (paso 4c del diseno).
    "toolchain/tools/estratos-fmt",
    # El par cliente/servidor que prueba Endpoint RPC en Ring 3.
    "toolchain/tools/rpc-demo",

    # ── FORGE (pipeline de compilación) ─────────────────────────────
    # Librerías OPCIONALES que cada frontend elige enlazar (nunca embudos).
    # Ver toolchain/forge/README.md y toolchain/lang/cobol/cobol.md.
    # sem-asm: encoder tabla→bytes (lo usa el codegen de C).
    # bmo-verify: gate que valida el BEF (delega al validador de bmo-abi).
    # bmo-lower/bmo-opt: se recrearán CON código real al empezar su fase.
    "toolchain/forge/sem-asm",
    "toolchain/forge/bmo-verify",
    # bmo-lower: L1, el descenso genérico al ABI (la puerta INVOKE).
    "toolchain/forge/bmo-lower",

    # ── PLATFORM (CPU-aware Ring 0/3 intermediary) ────────────────
    # The only crate in BMO that knows the target CPU. Currently
    # x86-64 only; ports will add Ultra_kernel_<arch>/ trees and
    # aarch64/riscv64 features here.
    "bmo-arch",
]

exclude = [
    # Extern submodule with its own Cargo workspace
    "extern/gnucobol-rs",

    # Sub-workspace (has its own [workspace] because build.ps1
    # Push-Locations into this directory to build the EFI binary;
    # see /Ultra_kernel_x86-64/uefi_chain/Cargo.toml).
    "Ultra_kernel_x86-64/uefi_chain",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
