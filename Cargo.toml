[workspace]
resolver = "2"
members = [
    # ── ULTRA KERNEL (Ring 0 base + faggin chain) ──────────────────
    "Ultra_kernel/boot_context",
    "Ultra_kernel/uefi_chain",
    "Ultra_kernel/faggin",
    "Ultra_kernel/kernel",
    "Ultra_kernel/Ultra_userspace",

    # ── SHARED (Ring 0 + Ring 3) ────────────────────────────────────
    "Uso_Reales_Crates/shared/bmo-hal",
    "Uso_Reales_Crates/shared/hw-profile",
    "Uso_Reales_Crates/shared/nvram-log",
    "Uso_Reales_Crates/shared/bmo-channel",

    # ── ABI (Foundation) ────────────────────────────────────────────
    "Uso_Reales_Crates/abi/bmo-abi",
    "Uso_Reales_Crates/abi/bmo-rt",

    # ── DRIVERS (Hardware) ───────────────────────────────────────────
    "Uso_Reales_Crates/drivers/audio",
    "Uso_Reales_Crates/drivers/net",
    "Uso_Reales_Crates/drivers/storage/ahci",
    "Uso_Reales_Crates/drivers/storage/fat32",
    "Uso_Reales_Crates/drivers/storage/nvme",
    "Uso_Reales_Crates/drivers/usb/input",
    "Uso_Reales_Crates/drivers/usb/uhid",
    "Uso_Reales_Crates/drivers/usb/xhci",

    # ── SERVICES (System) ──────────────────────────────────────────
    "Uso_Reales_Crates/services/cabina-core",
    "Uso_Reales_Crates/services/byte-defender",
    "Uso_Reales_Crates/services/timeback",

    # ── PLUGINS (Vendored third-party) ──────────────────────────────
    "crates_Personal/plugins/goblin",
    "crates_Personal/plugins/plain",
    "crates_Personal/plugins/scroll",
    "crates_Personal/plugins/scroll_derive",

    # ── TOOLS (Build-time) ──────────────────────────────────────────
    "Uso_Reales_Crates/tools/lang/cobol",
    "Uso_Reales_Crates/tools/lang/cpp",
    "Uso_Reales_Crates/tools/lang/c",
]

exclude = [
    # Extern submodule with its own Cargo workspace
    "extern/gnucobol-rs",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
