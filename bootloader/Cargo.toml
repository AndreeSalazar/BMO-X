[package]
name = "fastos-bootloader"
version = "0.1.0"
edition = "2021"
authors = ["FastOS Project"]
description = "FastOS UEFI bootloader — loads kernel directly in 64-bit mode"

[dependencies]
uefi = { version = "0.37", features = ["alloc", "global_allocator", "logger", "panic_handler", "unstable"] }
log = "0.4"
fastos-boot-protocol = { path = "../boot_protocol" }

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[package.metadata.bootloader]
target = "x86_64-unknown-uefi"
