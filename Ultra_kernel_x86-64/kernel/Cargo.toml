[package]
name = "bmo-kernel"
version = "2.0.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO kernel — Ring 0 base (UEFI pure, no external deps)"
license = "Techne"

[dependencies]
boot-context = { path = "../boot_context" }
bmo-channel = { path = "../../platform/shared/bmo-channel" }
bmo-xhci = { path = "../../platform/drivers/usb/xhci" }
bmo-input = { path = "../../platform/drivers/usb/input" }
bmo-uhid = { path = "../../platform/drivers/usb/uhid" }

[[bin]]
name =     "bmo-kernel"
path = "src/main.rs"
