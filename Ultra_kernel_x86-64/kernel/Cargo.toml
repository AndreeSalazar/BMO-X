[package]
name = "bmo-kernel"
version = "2.0.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO kernel — Ring 0 base (UEFI pure, no external deps)"
license = "Techne"

[dependencies]
boot-context = { path = "../boot_context" }
bmo-channel = { path = "../../platform/shared/bmo-channel" }
bmo-xhci = { path = "../../platform/drivers/usb/xhci" }
bmo-input = { path = "../../platform/drivers/usb/input" }
bmo-uhid = { path = "../../platform/drivers/usb/uhid" }
# Disco: AHCI/SATA, que es donde vive el disco de BMO (el NVMe de esta
# maquina es el de Windows).
bmo-block = { path = "../../platform/drivers/storage/block" }
bmo-particiones = { path = "../../platform/drivers/storage/particiones" }
bmo-ahci = { path = "../../platform/drivers/storage/ahci" }
# Sistema de ficheros: lee FAT32/exFAT sobre el contrato de bloques, sin
# saber que hay debajo.
bmo-fat32 = { path = "../../platform/drivers/storage/fat32" }
# ESTRATOS: el formato propio. Solo lectura por ahora -- el modulo del kernel
# (ring0/estratos.rs) no llama a `write` en ningun sitio.
bmo-estratos = { path = "../../platform/drivers/storage/estratos" }
# Lo que el disco CONTESTA (palabras 217, 169, 106, 209, 75, 76, 77) y el
# VEREDICTO sobre el. Son dos crates y no una a proposito: los hechos no opinan
# y el juez vive en `platform/shared/` porque **alli se puede probar** (L7b).
bmo-identify = { path = "../../platform/drivers/storage/identify" }
bmo-disco-juicio = { path = "../../platform/shared/bmo-disco-juicio" }
# El FORMATO de TRIM: un rango de LBA convertido en descriptores de
# `DATA SET MANAGEMENT`. Fuera del kernel por lo mismo que los dos de arriba --
# un descriptor mal empaquetado no da un fallo, hace que el disco olvide
# sectores que si importaban, y eso se prueba con `cargo test`, no flasheando.
bmo-trim = { path = "../../platform/drivers/storage/trim" }
# BLAKE3, directo y no de rebote por ESTRATOS. El cargador lo usa POR TROZOS
# --`Hasher::update` segun aterriza cada seccion-- y eso no es cosa del sistema
# de ficheros: es del que carga. Sigue siendo UNA sola implementacion del hash,
# la misma que usa `bmo-abi`; lo que cambia es que quien la necesita la pide.
bmo-hash = { path = "../../platform/shared/bmo-hash" }
# EL RECORTE, y es el mismo que el de Ring 3 y el del previsualizador. Antes el
# kernel tenia el suyo escrito a mano dentro de `splash.rs` y no coincidia: el
# de aqui DESCARTABA el rectangulo si una esquina se salia, en vez de
# recortarlo. Coste medido en el video del 2026-08-15: 2.625 rectangulos
# tirados por fotograma y el 7,2% de la pantalla sin escribir nunca.
bmo-dibujo = { path = "../../platform/shared/bmo-dibujo" }
# La PUERTA: la decision de si un BEX es admisible. Sin alloc y sin
# dependencias, para que sea la MISMA que corre en el toolchain al compilar.
# Ver docs/identidad/EL_CONTRATO_DE_CARGA.md.
bmo-bex-gate = { path = "../../platform/abi/bmo-bex-gate" }
# CABINA: telemetria omnisciente entre Ring 0 y Ring 3 (el cockpit del sistema).
cabina-core = { path = "../../platform/services/cabina-core" }
# Sonido. Hoy son 109 lineas de altavoz de PC --puerto 0x61 y un retardo por
# TSC-- y llevaban meses sin que las llamara NADIE: era uno de los crates
# huerfanos de la auditoria de deuda tecnica. `ring0/obj/audio.rs` las conecta.
bmo-audio = { path = "../../platform/drivers/audio" }
# USB Audio Class: decide QUE peticiones mandar. No toca hardware --por eso se
# prueba entero en el anfitrion-- y quien las manda es `dev/uaudio.rs`.
bmo-uaudio = { path = "../../platform/drivers/usb/uaudio" }
bmo-rtc = { path = "../../platform/drivers/rtc" }
# Red: de momento solo sabe RECONOCER una Realtek 8169/8168 -- leer su MAC y su
# enlace. Cero escrituras al aparato, cero dependencias propias. Quien la llama
# es `dev/red.rs`.
bmo-net = { path = "../../platform/drivers/net" }
# Lo que la PLACA cuenta de si misma. La interpretacion de una cabecera ACPI se
# prueba en el anfitrion; aqui solo se leen direcciones fisicas.
bmo-firmware = { path = "../../platform/shared/bmo-firmware" }
# La ciudad del arranque. La DIBUJA la CPU --cero bytes de datos-- y vive
# fuera de las dos orillas porque es aritmetica pura: asi se puede probar en
# el anfitrion, que es lo que un fondo de arranque nunca podia.
bmo-ciudad = { path = "../../platform/shared/bmo-ciudad" }

[features]
# ** EL METRO DE LA PUERTA, Y POR QUE NO VIENE POR DEFECTO (2026-08-16).
#
# `meter::start`/`stop` son dos `rdtsc`, y la tanda en metal midio lo que cuesta
# uno: **69 ticks en un bucle de 43 y 107 en uno de 4**. `dispatch` entero mide
# 87-104. O sea que el termometro es del tamano del enfermo -- la fila `DISPATCH`
# no se puede leer, y encima cada puerta del sistema paga ese instrumento.
#
# La regla que ya lleva escrita `meter.rs` es la que decide: **el instrumento se
# retira cuando contesta**. Los cuatro sellos del stub se retiraron el mismo dia
# por costar el 17%; estos dos cuestan el 8-12% de una puerta y se quedaban.
#
# Con esto hay DOS builds y la diferencia entre ellos ES la medida, tomada desde
# Ring 3 y sin sesgo:
#
#    normal                          sin metro. La puerta cuesta 69-107 menos.
#    --features metro_puerta         como hasta hoy: `dispatch` se mide.
#
# [!] `build.ps1` NO lo pasa, asi que lo que se despliega es el build rapido. Y
# [!] la cuenta de puertas NO se apaga: `DOORS` sigue contando en los dos, porque
# es el denominador del histograma por clase y la medida mas barata que queda
# pendiente (puertas por segundo del escritorio).
default = []
metro_puerta = []

[[bin]]
name =     "bmo-kernel"
path = "src/main.rs"
