[workspace]
# uefi_chain has its own [workspace] because build.ps1 Push-Locations
# into this directory to build the EFI binary. The local workspace
# means cargo from this dir doesn't walk up to the FastOS root.
# It also means this dir is excluded from FastOS's parent workspace
# (see /Cargo.toml exclude = [...]).

[package]
name = "uefi-chain"
version = "2.0.0"
edition = "2021"
description = "UEFI-side boot chain for Ultra_kernel_x86-64: 5 tiny layers, one EFI binary."

[dependencies]
boot-context = { path = "../boot_context" }
