[workspace]
# Ultra_kernel/faggin/ — 12 single-purpose boot stages + 1 shared lib.
#
# Each stage does ONE thing, is ~30-100 lines, and is built with
# opt-level = "z" so the resulting binary is as small as possible.
# Order of execution (1 -> 12, then jmp to kernel@0x400000):
#
#   s1_serial    COM1 init
#   s2_gdt       GDT + TSS + IST
#   s3_idt       IDT (256 entries)
#   s4_cpuid     vendor + brand + features
#   s5_control   CR0 + CR4 + XCR0
#   s6_fpu       fninit + MXCSR + xsave
#   s7_tsc       TSC calibration
#   s8_syscall   STAR + LSTAR + FMASK
#   s9_paging    PML4 + identity + higher-half
#   s10_heap     bitmap + buddy + slab
#   s11_acpi     RSDP scan
#   s12_devices  ACPI + PCI + APIC + HPET + i8042
#   --> jmp kernel@0x400000
#
# Per-package opt-level = "z" overrides the [profile.release] default
# of 3. With LTO + codegen-units = 1 + panic = "abort" + strip +
# "symbols", each stage should land at 1-3 KB flat binary.
members = [
    "serial_shared",
    "s1_serial",
    "s2_gdt",
    "s3_idt",
    "s4_cpuid",
    "s5_control",
    "s6_fpu",
    "s7_tsc",
    "s8_syscall",
    "s9_paging",
    "s10_heap",
    "s11_acpi",
    "s12_devices",
]
resolver = "2"

# ── Workspace default profile (used by non-overridden members) ──
[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

# ── Per-package overrides: every faggin stage MUST be tiny ─────
# Each stage is a few KB of code. Optimize for size, not speed.
# The faggin principle is: "this stage does one thing, so it should
# be as small as possible".
[profile.release.package."serial_shared"]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."s1-serial"]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

