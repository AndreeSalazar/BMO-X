
<canvas id="fb" style="width:100%;display:block;background:#000;border-radius:8px;"></canvas>
<script>
const canvas = document.getElementById('fb');
const ctx = canvas.getContext('2d');
canvas.width = 680;
canvas.height = 400;

const W = canvas.width, H = canvas.height;
let t = 0;

const COLORS = {
  red: '#CC2200',
  redBright: '#FF3311',
  blue: '#0A1A3A',
  blueMid: '#0D2B6E',
  green: '#00FF66',
  greenDim: '#00CC44',
};

const particles = Array.from({length: 120}, (_, i) => ({
  x: W/2, y: H/2,
  vx: (Math.random()-0.5)*3.5,
  vy: (Math.random()-0.5)*3.5,
  life: Math.random(),
  maxLife: 0.6 + Math.random()*0.4,
  color: i % 3 === 0 ? COLORS.red : i % 3 === 1 ? COLORS.green : COLORS.blueMid,
  size: 1.5 + Math.random()*2,
}));

const rings = Array.from({length: 4}, (_, i) => ({
  r: 40 + i*55,
  phase: i * Math.PI / 2,
  speed: 0.012 + i*0.004,
  color: i % 2 === 0 ? COLORS.red : COLORS.green,
}));

const glyphLines = [
  'FASTOS KERNEL v1.0',
  'RING 0 INIT........OK',
  'FRAMEBUFFER.......OK',
  'CPU [RYZEN 5600X].OK',
  'AVX2..............OK',
];

let charReveal = 0;

function drawBg() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 40) {
    ctx.strokeStyle = 'rgba(0,20,60,0.4)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawRings() {
  rings.forEach(ring => {
    ctx.save();
    ctx.translate(W/2, H/2);
    for (let a = 0; a < Math.PI*2; a += Math.PI/8) {
      const angle = a + ring.phase + t * ring.speed;
      const x = Math.cos(angle) * ring.r;
      const y = Math.sin(angle) * ring.r * 0.45;
      const size = a % (Math.PI/2) === 0 ? 4 : 2;
      ctx.fillStyle = ring.color;
      ctx.globalAlpha = 0.7 + Math.sin(t*0.05 + a)*0.3;
      ctx.fillRect(x-size/2, y-size/2, size, size);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  });
}

function drawParticles() {
  particles.forEach(p => {
    p.life -= 0.008;
    if (p.life <= 0) {
      p.x = W/2; p.y = H/2;
      p.vx = (Math.random()-0.5)*3.5;
      p.vy = (Math.random()-0.5)*3.5;
      p.life = p.maxLife;
    }
    p.x += p.vx;
    p.y += p.vy * 0.5;
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha * 0.85;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function drawCore() {
  const pulse = 1 + Math.sin(t * 0.08) * 0.15;
  const r = 22 * pulse;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.fillStyle = COLORS.redBright;
  ctx.globalAlpha = 0.9;
  ctx.fillRect(-r, -r*0.45, r*2, r*0.9);
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.6;
  ctx.fillRect(-r*0.3, -r*0.15, r*0.6, r*0.3);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawScanline() {
  const y = (t * 2.5) % H;
  ctx.strokeStyle = 'rgba(0,255,102,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
}

function drawGlyphs() {
  ctx.font = '11px monospace';
  charReveal += 0.4;
  const totalChars = glyphLines.join('').length;
  let shown = Math.floor(charReveal);
  let lineY = 28;
  let count = 0;
  glyphLines.forEach((line, li) => {
    let displayLine = '';
    for (let c = 0; c < line.length; c++) {
      if (count < shown) { displayLine += line[c]; count++; }
      else { displayLine += ' '; count++; }
    }
    const isOk = displayLine.includes('OK');
    ctx.fillStyle = isOk ? COLORS.green : '#445566';
    ctx.globalAlpha = isOk ? 1 : 0.6;
    ctx.fillText(displayLine, 20, lineY + li * 18);
  });
  ctx.globalAlpha = 1;
}

function drawWaveBar() {
  const barY = H - 40;
  for (let x = 0; x < W; x += 3) {
    const wave = Math.sin(x * 0.04 + t * 0.1) * 12;
    const h2 = 6 + Math.abs(wave);
    const col = x < W/3 ? COLORS.red : x < W*2/3 ? COLORS.blueMid : COLORS.green;
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(x, barY - h2, 2, h2*2);
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  ctx.font = '500 20px monospace';
  ctx.fillStyle = COLORS.green;
  ctx.globalAlpha = 0.9 + Math.sin(t*0.06)*0.1;
  ctx.textAlign = 'center';
  ctx.fillText('[ FASTOS ]', W/2, H/2 + 80);
  ctx.font = '11px monospace';
  ctx.fillStyle = COLORS.red;
  ctx.globalAlpha = 0.7;
  ctx.fillText('RING 0 → FRAMEBUFFER ACTIVE', W/2, H/2 + 100);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

function loop() {
  t++;
  drawBg();
  drawScanline();
  drawRings();
  drawParticles();
  drawCore();
  drawGlyphs();
  drawWaveBar();
  drawTitle();
  requestAnimationFrame(loop);
}
loop();
</script>
