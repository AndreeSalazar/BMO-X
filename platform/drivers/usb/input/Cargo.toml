[package]
name = "bmo-input"
version = "0.1.0"
edition = "2021"
description = "BMO Input Subsystem -- HAL-based keyboard/mouse/pointer driver with PS/2 and USB HID backends"

[lib]

[dependencies]
# El FOCO salio a `platform/shared` (L8) y aqui se reexporta con su nombre de siempre.
bmo-foco = { path = "../../../shared/bmo-foco" }

[features]
default = ["ps2"]
ps2 = []
