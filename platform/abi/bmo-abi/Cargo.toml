[package]
name = "bmo-abi"
version = "2.0.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO ABI -- types, syscall definitions, interfaces (foundation layer)"

[dependencies]
# La regla de disposicion, que comparte con los frontends (2026-09-18).
bmo-disposicion = { path = "../../../toolchain/lang/disposicion" }
bitflags = "2.13.0"
# El unico BLAKE3 del sistema. Vivia dentro de esta crate; salio para que el
# kernel pueda usarlo sin arrastrar `alloc`. Ver src/bef/blake3.rs.
bmo-hash = { path = "../../shared/bmo-hash" }
# El lector de la tabla de requisitos, sin `alloc`, compartido con Ring 0.
bmo-carga-juicio = { path = "../../shared/bmo-carga-juicio" }

[dev-dependencies]
# Only for the hostile tests: nothing that runs on the machine links it.
bmo-hostile = { path = "../../shared/bmo-hostile" }
# Solo para las PRUEBAS: los offsets compartidos con el cargador del kernel.
# No es dependencia de la libreria -- el contrato no depende de la puerta.
bmo-bex-gate = { path = "../bmo-bex-gate" }
