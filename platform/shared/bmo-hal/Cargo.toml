[package]
name = "bmo-hal"
version = "1.0.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO HAL — hardware abstraction layer types shared across rings"

[dependencies]
# The kernel's boot handoff struct. Renamed from bmo-boot-protocol
# (which used to live in a now-deleted kernel/ tree) to boot-context
# (which lives in Ultra_kernel_x86-64/boot_context/).
boot-context = { path = "../../../Ultra_kernel_x86-64/boot_context" }
