[package]
name = "bmo-userland"
version = "2.0.0"
edition = "2021"
description = "Runtime de Ring 3: los dos syscalls, capabilities y la pantalla"

# ** LA UNICA DEPENDENCIA, y la regla que NO rompe.
#
# La regla es "un proceso Ring 3 no comparte structs con el kernel: habla con el
# por handles y numeros de operacion". `bmo-dibujo` no es un struct del kernel:
# es ARITMETICA --recorte, Bresenham, la funcion de arista-- sin `unsafe`, sin
# punteros y sin dependencias. Compartirla no acopla los dos anillos; es el
# mismo argumento que `bmo-hash`, donde las dos orillas dan la misma suma
# porque ejecutan el mismo codigo.
#
# Y no compartirla ya costo: el kernel tenia su propia regla de recorte y no
# coincidia con esta. Ver la cabecera de `src/dibujo/mod.rs`.
[dependencies]
bmo-dibujo = { path = "../../platform/shared/bmo-dibujo" }
# ** Y la SEGUNDA, por el mismo argumento: `bmo-puerta-red` no es un struct del
# kernel, es la FORMA del buzon del GATE RED y sus veredictos, sin `unsafe`. El
# kernel la lee con la misma aritmetica con la que Ring 3 la escribe, y dos
# copias de una forma son como se consigue que un indice valga dos cosas.
bmo-puerta-red = { path = "../../platform/shared/bmo-puerta-red" }
