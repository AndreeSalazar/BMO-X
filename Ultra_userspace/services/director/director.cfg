# director.cfg -- el aspecto del escritorio de BMO-X
#
# Se lee UNA vez, al arrancar. Lo que no se entienda sale en la consola de
# Ejecutar con su numero de linea, y esa clave se queda como estaba: un fichero
# mal escrito no deja el escritorio sin arrancar.
#
# Colores como #RRGGBB. Interruptores como si / no.
#
# [!] Este fichero lo copia el build a sys/ en cada despliegue. Si lo cambias en
# A:\sys\ directamente, el siguiente despliegue lo pisa: el de verdad esta en el
# repo, en Ultra_userspace/services/director/director.cfg.

# -- El fondo del escritorio (un degradado de arriba a abajo)
fondo_arriba   = #1B2233
fondo_abajo    = #0C0F17

# -- El acento: lo usan TODAS las ventanas (titulos, seleccion, Ejecutar) y la barra
acento         = #60A5FA

# -- La barra
barra_fondo    = #0F131D
barra_borde    = #262F42
barra_flotante = si        # si = pastilla separada del borde; no = la de siempre
barra_hueco    = 6         # pixeles de hueco, de 0 a 12

# -- Los widgets de la derecha
cpu            = si        # la parte del ultimo segundo que el nucleo no durmio
memoria        = si
vatios         = si        # el paquete entero, medido por el kernel
reloj          = si
