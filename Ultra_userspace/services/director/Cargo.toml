[package]
name = "bmo-service-director"
version = "0.1.0"
edition = "2021"
description = "El compositor de BMO -- el proceso Ring 3 que es dueno de la pantalla"

[[bin]]
name = "director"
path = "src/main.rs"

[dependencies]
# `bmo-rtc` vive en drivers/ pero DECLARA `capa: puro` y el guardian L8 lo
# comprueba: decide fechas y no toca un puerto.
bmo-rtc = { path = "../../../platform/drivers/rtc" }
bmo-userland = { path = "../../userland" }
# La politica de FOCO (quien recibe las teclas). Alli se puede PROBAR -- este
# binario es `no_main` para un target sin sistema operativo y no corre un test.
# ** Hasta el 2026-09-13 esto era `bmo-input`, un driver de Ring 0 enlazado desde
# Ring 3 solo por esta politica. L8: lo compartido entre anillos es `puro`.
bmo-foco = { path = "../../../platform/shared/bmo-foco" }
# El RECORTE, que usa la cara generada por MAQUETA para reparar un danio sin
# repintarlo todo. Es el mismo `Recorte` que usan el rasterizador y el kernel:
# medio abierto `[x0, x1)`, y una sola implementacion para las tres orillas.
bmo-dibujo = { path = "../../../platform/shared/bmo-dibujo" }
# LA RESTA que convierte un clic de pantalla en un clic de la app. Fuera del
# `.bex` por la misma razon que el foco: aqui no corre un test, alli si.
bmo-golpe = { path = "../../../platform/shared/bmo-golpe" }
# EL RITMO: cuantos fotogramas publica cada app, cuantos se ven, cuantos se
# pierden, y quien marca el paso. Fuera por lo mismo: alli se prueba.
bmo-ritmo = { path = "../../../platform/shared/bmo-ritmo" }
# LA RESTA de frecuencia y vatios entre dos lecturas de contadores que solo
# crecen. El DIRECTOR es UN lector y guarda la suya.
bmo-juicio = { path = "../../../platform/shared/bmo-juicio" }
# El visor de imagenes: decodifica fuera, probado contra ficheros rotos.
bmo-imagen = { path = "../../../platform/shared/bmo-imagen" }
# El aspecto, leido de `sys/director.cfg` al arrancar.
bmo-config = { path = "../../../platform/shared/bmo-config" }
# La pila TCP/IP propia: hoy DHCP (`red ip`). Fuera por lo de siempre: alli se
# prueba contra servidores de mentira, y aqui no corre un test.
bmo-pila = { path = "../../../platform/shared/bmo-pila" }
# ANTENA/1: la conversacion y el juez de la lamina, para `red pagina` (N3a).
bmo-antena = { path = "../../../platform/shared/bmo-antena" }
