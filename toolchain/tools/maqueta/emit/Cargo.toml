[package]
name = "bmo-maqueta-emit"
version = "0.1.0"
edition = "2021"
description = "MAQUETA: turns a settled layout into something usable. A CONSUMER, not a generation -- nobody in the chain knows it exists."
license = "Simbiosis"

[dependencies]
bmo-maqueta-layout = { path = "../layout" }
# ** El PADRE, y no sube de generacion: `emit` es EL CONSUMIDOR y no una
# generacion de la cadena -- nadie de la cadena sabe que existe, asi que puede
# leer de cualquier eslabon. La paleta necesita las REGLAS crudas (`Document`),
# no la maquetacion: un color no tiene sitio, tiene nombre.
bmo-maqueta-node = { path = "../node" }
# EL recortador de la casa, y no uno propio. `bmo-dibujo` existe porque hubo dos
# --el previsualizador recortaba, el kernel descartaba-- y se tiraban 2.625 de
# 8.775 rectangulos por fotograma. Escribir aqui un tercero habria sido repetir
# ese fallo dentro de la herramienta que existe para que no se repitan.
bmo-dibujo = { path = "../../../../platform/shared/bmo-dibujo" }
# ** EL FORMATO de la cara que viaja, y NO una copia local de sus offsets.
#
# Lo consume tambien el LECTOR, que corre en Ring 3 sin asignador. Si el emisor
# tuviera los suyos serian dos formatos con el mismo nombre -- y un formato mal
# empaquetado no da un fallo, da algo peor: se lee mal y nadie se entera.
bmo-maqueta-cara = { path = "../../../../platform/shared/bmo-maqueta-cara" }

[dev-dependencies]
bmo-maqueta-cascade = { path = "../cascade" }
bmo-maqueta-verdict = { path = "../verdict" }
bmo-maqueta-diag = { path = "../diag" }
