[package]
name = "bmo-verify"
version = "0.1.0"
edition = "2021"
description = "Gate de verificación: valida el BEF (capabilities, memory-safety, firma) antes del BMO ABI. El único checkpoint común. Habilita SIPs (Singularity)."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
# La PUERTA: la misma decision que corre en Ring 0 al cargar. Ver el comentario
# de verify(): nada que el kernel vaya a rechazar puede salir de este toolchain.
bmo-bex-gate = { path = "../../../platform/abi/bmo-bex-gate" }
bmo-abi = { path = "../../../platform/abi/bmo-abi" }
