# cobol2002.toml -- ISO/IEC 1989:2002 (COBOL 2002)
[standard]
iso_number = "ISO/IEC 1989:2002"
year = 2002
short_name = "COBOL 2002"

[features]
scope_terminators = true
inline_perform = true
nested_programs = true
evaluate = true
conditional_variable = true
call_by_content = true
report_writer = false
intrinsic_functions = true
recursive_programs = true
screen_section = false
object_oriented = true
national_locale = true
validate = true
external_repository = false
local_storage_section = true
free_format = true
any_length_items = true
user_functions = true
float_binary = true
dynamic_length_tables = false
exception_handling = true

[divisions]
required = ["IDENTIFICATION", "PROCEDURE"]

[predefined]
COBOL_STANDARD = "ISO/IEC 1989:2002"

[based_on]
parent = "cobol85"
