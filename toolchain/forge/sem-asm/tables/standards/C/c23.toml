# c23.toml -- ISO/IEC 9899:2024 (C23)
[standard]
iso_number = "ISO/IEC 9899:2024"
year = 2024
short_name = "C23"

[features]
_This = true
typeof = true
typeof_unqual = true
constexpr = true
auto_type = true
nullptr = true
_embed = true
digit_separators = true
binary_literals = true
attributes = true
empty_initializer = true
enumerated_types_with_underlying = true
unreachable = true
unsequenced = true
reproducible = true
label_address_semantics = true
improved_integer_promotions = true
decimal_floating_point = true

[type_rules]
implicit_int = false
implicit_function_decl = false
return_without_value_allowed = false

[predefined_macros]
__STDC__ = 1
__STDC_VERSION__ = 202311

[based_on]
parent = "c17"
