#  inti.toml -- lo que INTI necesita saber de x86-64.
#
#  == La idea, y es de Eddi (2026-08-19) ==
#
#      "pensaba que podrias crear una libreria `usar x86-64`; esa es libreria
#       PARA ahorrar esfuerzo, una sola llamada, y asi facilitar la escritura
#       en INTI"
#
#  Eso es esto. Una linea en el fichero:
#
#      usa x86_64
#
#  y el programa tiene los nombres de abajo. Sin declarar nada, sin cabeceras,
#  sin repetir bytes.
#
#  == Y lo que la idea arregla, que es mas de lo que parece ==
#
#  El nombre del modulo **es la declaracion de que el fichero no es portable**.
#  `usa metal` --que es como se escribia antes-- esconde la arquitectura:
#  el metal de que maquina? `usa x86_64` la dice, y entonces:
#
#    - el compilador la puede CONTAR, igual que cuenta los `crudo`;
#    - compilando para otra maquina, la linea falla con un mensaje claro en vez
#      de con un nombre desconocido a mitad de fichero;
#    - y el fichero se puede leer de arriba abajo sabiendo a que se ata.
#
#  ** Ademas cierra un cabo suelto: la lista de "que pide `crudo`" estaba en
#  `lang/inti/biblioteca.toml` marcada como PROVISIONAL, porque depende de la
#  maquina. Aqui esta en su sitio.
#
#  == Lo que NO se repite aqui ==
#
#  Los BYTES. Estan en `intrinsics.toml`, que es la fuente y la comparte BMO C.
#  Este fichero solo dice **como se llama en INTI** cada uno y **si alguien
#  comprueba al otro lado**. Dos declaraciones de los mismos bytes acabarian
#  discrepando.

[meta]
arquitectura = "x86_64"
version = 1
# La tabla de bytes que hay detras de los nombres de abajo.
intrinsecos = "intrinsics.toml"

# ===================================================================
#  El perfil de la maquina
# ===================================================================
#
#  Son DATOS, y por eso estan aqui y no en el compilador. El frontend de INTI
#  no puede nombrar una maquina --hay un test que lo comprueba-- asi que el
#  ancho de un puntero tiene que llegarle por este camino o por ninguno.
[maquina]
ancho_de_puntero = 8
alineacion_maxima = 16
orden_de_bytes = "pequeno_primero"
la_pila_crece = "hacia_abajo"

# ===================================================================
#  ** LOS REGISTROS, y para que sirve cada uno
# ===================================================================
#
#  Peticion de Eddi (2026-08-19): *"que `usa x86_64` CARGUE TODO lo que x86-64
#  representa... como dijiste registros, pero en x86-64 dira por que"*.
#
#  Y arregla algo que estaba mal desde hace unas horas: el asignador de
#  registros de F3 llevaba la lista **escrita a mano en Rust**. Eso es
#  exactamente lo que `intrinsics.toml` decidio no hacer nunca -- *"anadir una
#  instruccion = 1 entrada TOML, CERO Rust"* -- y no habia motivo para que los
#  registros fueran la excepcion.
#
#  Ahora el emisor no DECIDE que registros usar: los LEE.
#
#  == Los roles, y que significa cada uno ==
#
#    trabajo      donde se hace la operacion. Toda binaria los usa
#    argumento    por aqui llegan los parametros, en este orden
#    libre        se puede usar sin pedir permiso... hasta la proxima llamada
#    preservado   si lo tocas, lo devuelves como estaba
#    pila/marco   no se tocan nunca. La maquina los usa para saber donde esta
#
#  ** El que decide el reparto es `preservado`. Un registro libre es mas barato
#  --no hay que guardarlo-- pero **una llamada lo puede pisar**; un preservado
#  sobrevive a la llamada y cuesta dos instrucciones. Esa es toda la diferencia,
#  y de ahi sale el freno del asignador.
[registros]
#  numero, nombre, rol, y el porque cuando lo tiene.
rax = { n = 0, rol = "trabajo",    nota = "y por aqui se devuelve el resultado" }
rcx = { n = 1, rol = "trabajo",    nota = "el otro lado de toda operacion binaria" }
rdx = { n = 2, rol = "argumento",  orden = 3, nota = "y el resto de una division cae aqui" }
rbx = { n = 3, rol = "preservado", nota = "usarlo cuesta guardarlo y devolverlo" }
rsp = { n = 4, rol = "pila",       nota = "la cima. No se toca" }
rbp = { n = 5, rol = "marco",      nota = "desde aqui se cuentan las locales" }
rsi = { n = 6, rol = "argumento",  orden = 2 }
rdi = { n = 7, rol = "argumento",  orden = 1 }
r8  = { n = 8, rol = "argumento",  orden = 5 }
r9  = { n = 9, rol = "argumento",  orden = 6 }
r10 = { n = 10, rol = "libre" }
r11 = { n = 11, rol = "libre" }
r12 = { n = 12, rol = "preservado" }
r13 = { n = 13, rol = "preservado" }
r14 = { n = 14, rol = "preservado" }
r15 = { n = 15, rol = "preservado" }

# ===================================================================
#  El reparto: cuales usa INTI para que
# ===================================================================
#
#  Esto no es la ABI: es **la decision de INTI dentro de la ABI**, y por eso
#  esta en una seccion aparte. La ABI dice lo que se puede; esto dice lo que se
#  hace.
# ===================================================================
#  LA PUERTA -- el nombre esta en otra tabla; aqui esta el COMO
# ===================================================================
#
#  ** Esto no contradice lo que se dice al final de este fichero. Lo completa, y
#  la diferencia es toda la arquitectura de INTI en cuatro lineas:
#
#      QUE se puede llamar   ->  `modulos.toml`, seccion [bmo]     (agnostico)
#      COMO se cruza aqui    ->  esta seccion                      (de x86-64)
#
#  Un programa pide `usa bmo` y escribe `invoca(...)`. Esa linea es identica en
#  toda maquina. Lo que cambia por maquina es DONDE van los argumentos, y eso no
#  puede vivir en el frontend ni puede vivir en el emisor escrito a mano: vive
#  aqui, que es donde vive todo lo que depende de esta maquina y de ninguna
#  otra.
#
#  Por eso `invoca` sigue sin estar en `[nombres]`: un programa que solo quiere
#  `lee_reloj` sigue sin tener la puerta a mano. Esta seccion no da acceso a
#  nada -- solo dice como se emite lo que ya se tenia derecho a pedir.
[puerta]

#  La instruccion. Se nombra por su fila de `intrinsics.toml`, no por sus bytes:
#  quien emite los bytes es `bmo_lower`.
instruccion = "syscall"

#  Donde va el numero de la puerta. Solo hay una (INVOKE = 0) y ese es el
#  congelamiento del que habla el maestro: dos syscalls y ya.
numero = "rax"

#  ** POR DONDE VAN LOS ARGUMENTOS. Y aqui esta la fila que importa:
#
#      llamada normal   rdi  rsi  rdx  rcx  r8  r9
#      la puerta        rdi  rsi  rdx  r10  r8  r9
#                                      ^^^
#
#  El CUARTO no es `rcx`, y no es un capricho de nadie: la instruccion `syscall`
#  **machaca `rcx`** con la direccion de vuelta, en el silicio, antes de que el
#  kernel mire nada. Un argumento puesto ahi se pierde entre la instruccion y su
#  destino.
#
#  ** Esa es la clase de detalle por la que las tablas ganan al codigo: escrito
#  aqui es un dato que se puede comparar con el manual y con el kernel. Escrito
#  a mano dentro de un emisor es una linea que alguien copia mal una vez y
#  nadie vuelve a leer.
argumentos = ["rdi", "rsi", "rdx", "r10", "r8", "r9"]

#  ** POR DONDE VUELVE LA RESPUESTA. Y son DOS, que es lo que casi se me pasa.
#
#  La puerta de BMO-X no contesta una cosa: contesta un CODIGO y un VALOR, por
#  registros distintos y a la vez.
#
#      rax   el codigo. 0 es lo unico que significa exito, y los 32 bits altos
#            llevan las banderas del kernel -- la que distingue "no tienes
#            permiso" de "ese handle no existe", por ejemplo.
#      rdx   el valor. Un handle, un puntero, un numero.
#
#  Por eso `usa bmo` trae DOS nombres para una sola puerta: `invoca` recoge el
#  codigo y `invoca_valor` recoge el valor. **La instruccion que se emite es
#  identica**; lo unico que cambia es de que registro se lee despues.
#
#  ** Y esto es exactamente lo que el emisor hizo mal el primer dia: leia `rax`
#  para los dos, asi que `invoca_valor` devolvia el codigo. Habria compilado,
#  habria corrido, y todo puntero pedido al kernel habria valido cero -- que es
#  indistinguible de un kernel que dice que no.
#
#  Cual recoge cual **no se decide aqui**: eso es del ABI de BMO-X, no de esta
#  maquina, y vive en `modulos.toml`, seccion [recoge]. Aqui solo esta el par de
#  registros.
codigo = "rax"
valor = "rdx"

#  Lo que la puerta destruye por el camino, aunque nadie se lo pida. Se declara
#  para que el dia que el asignador reparta estos registros, no los reparta
#  encima de una llamada al sistema.
destruye = ["rcx", "r11"]

[reparto]

#  Los de trabajo. Toda operacion binaria pasa por ellos, asi que no se pueden
#  repartir entre temporales.
trabajo = ["rax", "rcx"]

#  ** Los que el asignador reparte entre los temporales.
#
#  Son estos tres y no mas por dos motivos, y los dos son concretos:
#
#    1. `rdx`, `rsi` y `rdi` traen los argumentos al entrar, y el prologo YA los
#       ha copiado al marco cuando el reparto empieza. Ese orden no es casual:
#       romperlo perderia los parametros.
#    2. `r8`..`r15` necesitan un prefijo distinto en cada instruccion, y
#       `bmo_lower` no trae hoy esos helpers. Es trabajo del emisor de bytes, no
#       de esta tabla -- y el dia que los traiga, **esta linea crece y no cambia
#       nada mas**.
temporales = ["rdx", "rsi", "rdi"]

#  OJO: Y por que NO se usan los preservados, que serian ocho mas:
#
#  Porque sobrevivir a una llamada solo importa si hay llamadas, y guardarlos
#  cuesta dos instrucciones por funcion **aunque no se use ninguna**. Mientras
#  el emisor no emita llamadas, pagar eso seria pagar por un problema que no se
#  tiene. El dia que las emita, esta lista es la que cambia.
preservados_en_uso = []

# ===================================================================
#  Los nombres: como se llama en INTI cada instruccion
# ===================================================================
#
#  ** Y aqui esta la portabilidad de verdad, no en una promesa:
#
#  El dia que exista `arch/aarch64/inti.toml`, `lee_reloj` seguira existiendo
#  --con otra instruccion detras-- y `escribe_puerto` NO, porque ARM no tiene
#  puertos de E/S. Asi que un programa que solo use `lee_reloj` se porta, y uno
#  que use `escribe_puerto` no.
#
#  El compilador no decide cual es cual: lo dice esta tabla, y el programa se
#  entera al compilar para la otra maquina en vez de al ejecutarse.
[nombres]
# -- ** matematicas de coma flotante --------------------------------
#
#  Los operadores `+ - * /` de flotantes ya se emitian: son del lenguaje. Estos
#  son los que no tienen simbolo y hasta el 22-08 **no existian por ningun
#  nombre**, asi que un motor grafico en INTI se paraba en la primera normal de
#  un vector.
#
#  ** Ninguno pide `crudo`: la raiz de un negativo da NaN, que es un valor
#  DEFINIDO por IEEE-754. Y si alguien lo convierte a entero, ahi esta la Regla
#  12 esperando. Al otro lado hay quien comprueba.
raiz            = "sqrtsd"
minimo          = "minsd"
maximo          = "maxsd"

# ===================================================================
#  *** CUATRO REALES A LA VEZ (2026-08-23)
# ===================================================================
#
#  Eddi: *"dale con SIMD entonces, AVX2"*.
#
#  ** Y PIDEN `crudo`, al reves que `raiz` y compania. El motivo es la regla de
#  siempre: **al otro lado, hay alguien que comprueba?**
#
#      raiz(-1)          da NaN, que es un valor DEFINIDO por IEEE-754
#      suma_de_cuatro    escribe 32 bytes en una direccion que le das TU
#
#  Lo segundo es memoria cruda, y nadie comprueba que quepan. Es exactamente lo
#  mismo que `escribe_natural64`, y por eso va en la misma lista.
#
#  ** El nombre lleva "de_cuatro" y no "vectorial" a proposito: **el numero es
#  parte del contrato**. Quien escriba el bucle tiene que saber que avanza de
#  cuatro en cuatro, y un nombre que lo esconda le deja escribir un bucle que
#  pisa memoria en la ultima vuelta.
suma_de_cuatro       = "avx_suma4"
resta_de_cuatro      = "avx_resta4"
por_de_cuatro        = "avx_por4"
funde_de_cuatro      = "avx_funde4"
limpia_los_altos     = "avx_sin_altos"
absoluto        = "absd"

# -- tiempo y espera ------------------------------------------------
lee_reloj       = "rdtsc"
lee_reloj_serio = "rdtscp"
espera          = "pause"
#  ** Se llamaba `para` hasta el 21-08 y NO SE PODIA ESCRIBIR: `para` es palabra
#  clave (`para cada x en xs`), asi que `para()` no llegaba ni al analisis de
#  nombres -- moria en el parser con un mensaje que hablaba de otra cosa.
#
#  Llevaba asi desde que se escribio la tabla, y no lo vio nadie porque **nadie
#  habia compilado nunca una llamada a un nombre de este fichero**. Lo caza la
#  matriz de conformidad, que es justo para lo que esta.
detiene         = "hlt"
nada_que_hacer  = "nop"

# -- puertos de E/S (esto no existe fuera de x86) --------------------
entrada_puerto        = "inb"
entrada_puerto16      = "inw"
entrada_puerto32      = "inl"
escribe_puerto        = "outb"
escribe_puerto16      = "outw"
escribe_puerto32      = "outl"

# -- registros de control y modelo -----------------------------------
lee_msr         = "rdmsr"
escribe_msr     = "wrmsr"
lee_cr0         = "cr0"
escribe_cr0     = "set_cr0"
lee_cr3         = "cr3"
escribe_cr3     = "set_cr3"

# -- interrupciones y cache ------------------------------------------
sin_interrupciones = "cli"
con_interrupciones = "sti"
tira_la_cache      = "wbinvd"
olvida_pagina      = "invlpg"
limpia_linea       = "clflush"

# -- barreras ---------------------------------------------------------
barrera         = "mfence"
barrera_lectura = "lfence"
barrera_escritura = "sfence"

# -- cuentas de bits ---------------------------------------------------
#
#  OJO: Estos SEIS tambien los sirve `usa binarios`, con los mismos nombres y de
#  forma portable. Aqui estan porque en esta maquina son UNA instruccion, y
#  porque un programa de `llano` que ya declaro `usa x86_64` no deberia tener
#  que pedir dos modulos para contar bits.
#
#  ** La diferencia no es tecnica, es de declaracion: quien escribe
#  `usa binarios` dice *"esto se porta"*; quien escribe `usa x86_64` dice
#  *"esto no"*. El compilador no elige por ti cual de las dos cosas quieres
#  decir.
cuenta_unos     = "popcnt"
primer_uno      = "bsf"
ultimo_uno      = "bsr"
ceros_delante   = "lzcnt"
ceros_detras    = "tzcnt"
#  ** `da_la_vuelta` a secas es el que promete `usa binarios`, y hasta el 21-08
#  NO ESTABA AQUI: solo estaban las dos versiones con el ancho en el nombre. O
#  sea que el modulo portable prometia un nombre que esta maquina no sabia
#  traducir, y el programa se enteraba al emitir -- en silencio.
#
#  Va al de 64 porque es el ancho de un entero de INTI. Quien quiera el otro lo
#  pide por su nombre, que para eso lo lleva escrito.
da_la_vuelta    = "bswap64"
da_la_vuelta32  = "bswap"
da_la_vuelta64  = "bswap64"

# -- azar --------------------------------------------------------------
azar            = "rdrand"
azar_de_verdad  = "rdseed"

# -- lo que el CPU dice de si mismo -------------------------------------
que_cpu_eres    = "cpuid"

# -- ATOMICAS: la fortaleza que x86 tiene y casi nadie mas ------------
#
#  ** x86-64 tiene un modelo de memoria FUERTE (TSO): las escrituras se ven en
#  orden. En ARM no, y por eso alli el mismo programa necesita barreras que aqui
#  sobran. Es la fortaleza mas real de esta maquina y la que menos se nombra.
#
#  Lo que eso significa para INTI: estas operaciones son la base de cualquier
#  cosa compartida entre nucleos, y aqui son una instruccion.
intercambia        = "xchg"
compara_y_cambia   = "cmpxchg"
suma_y_devuelve    = "xadd"
suma_atomica       = "lock_add"
o_atomica          = "lock_or"
y_atomica          = "lock_and"

# -- las tablas del sistema (arranque y cambio de modo) ---------------
carga_gdt       = "lgdt"
carga_idt       = "lidt"
lee_gdt         = "sgdt"
lee_idt         = "sidt"
carga_tr        = "ltr"
carga_ldt       = "lldt"
cambia_gs       = "swapgs"

# -- el resto de los registros de control -----------------------------
lee_cr2         = "cr2"
lee_cr4         = "cr4"
escribe_cr4     = "set_cr4"
lee_banderas    = "flags"
escribe_banderas = "set_flags"

# -- estado extendido (XSAVE): lo que hace cara una puerta ------------
lee_xcr         = "xgetbv"
escribe_xcr     = "xsetbv"

# -- esperar sin quemar el nucleo -------------------------------------
vigila          = "monitor"
duerme_hasta    = "mwait"

# -- depurar y morir a proposito --------------------------------------
punto_de_ruptura = "int3"
instruccion_invalida = "ud2"
tira_cache_sin_escribir = "invd"


# ===================================================================
#  Cuales piden `crudo`
# ===================================================================
#
#  La regla no es "esto es de bajo nivel". Es:
#
#      ** al otro lado, hay alguien que comprueba?
#
#  `lee_reloj` no cambia nada y no puede romper nada: no pide `crudo`.
#  `escribe_puerto` habla con un aparato que hara lo que le mandes: si.
#  `sin_interrupciones` puede dejar la maquina sorda: si.
#
#  Y por eso `invoca` --la puerta del sistema-- no aparece en ninguna lista de
#  este fichero: al otro lado hay un kernel que valida una capability. La puerta
#  es de bajisimo nivel Y esta comprobada.
[crudo]
piden = [
    # ** Las cuatro de AVX escriben 32 bytes en una direccion que da el
    # programa, y nadie comprueba que quepan. Es memoria cruda, como
    # `escribe_natural64`, asi que estan aqui por la misma regla.
    "suma_de_cuatro", "resta_de_cuatro", "por_de_cuatro", "funde_de_cuatro",
    "entrada_puerto", "entrada_puerto16", "entrada_puerto32",
    "escribe_puerto", "escribe_puerto16", "escribe_puerto32",
    "lee_msr", "escribe_msr",
    "lee_cr0", "escribe_cr0", "lee_cr2", "lee_cr3", "escribe_cr3",
    "lee_cr4", "escribe_cr4",
    "sin_interrupciones", "con_interrupciones",
    "tira_la_cache", "tira_cache_sin_escribir", "olvida_pagina", "limpia_linea",
    "carga_gdt", "carga_idt", "carga_tr", "carga_ldt", "cambia_gs",
    "escribe_banderas", "escribe_xcr",
    "vigila", "duerme_hasta",
    "instruccion_invalida",
]

#  ** Y fijate en cuales NO piden `crudo` aunque suenen peligrosas:
#
#    - las ATOMICAS (`compara_y_cambia`, `suma_atomica`...): al otro lado esta
#      la coherencia de cache del propio silicio, que SI comprueba. Una
#      operacion atomica mal usada da un resultado raro, no una maquina rota.
#    - `lee_gdt`, `lee_idt`, `lee_cr0`... LEER no rompe nada.
#    - `punto_de_ruptura`: para el programa y ya. Es lo que se espera de el.
#
#  La regla sigue siendo la misma y por eso se puede aplicar sin discutir:
#  **al otro lado, hay alguien que comprueba?**

# ===================================================================
#  ** "SE PUEDEN HACER LIBRERIAS DE BINARIOS?" -- hasta donde llega una tabla
# ===================================================================
#
#  Pregunta de Eddi (2026-08-19), y no exagera: es la pregunta correcta sobre
#  el limite de este fichero.
#
#  La respuesta corta es **si, y ya se hace** -- `intrinsics.toml` lleva los
#  bytes de 62 instrucciones y ningun compilador de BMO los escribe a mano.
#
#  La larga tiene un limite, y conviene saberlo antes de chocar con el:
#
#  == Lo que SI cabe en una tabla ==
#
#  Una instruccion de forma fija. `hlt` son dos bytes y siempre los mismos;
#  `outb` son dos bytes y sus operandos van en registros que la propia
#  instruccion fija. Ahi una fila con `bytes = [...]` lo dice todo.
#
#  == Lo que NO cabe, y por que ==
#
#  ** `mov rax, [rbp-24]` NO ES UNA INSTRUCCION: es una FAMILIA.
#
#  Cambia con el registro de destino, con el registro base, con el tamano del
#  desplazamiento, con si hace falta un indice, y con si alguno de los dos
#  registros pasa del septimo --que entonces pide otro prefijo--. Son cientos
#  de combinaciones, y ponerlas en una tabla seria escribir a mano lo que un
#  algoritmo de veinte lineas calcula: **la codificacion de x86-64 no es una
#  lista, es una construccion** (prefijo, opcode, ModRM, SIB, desplazamiento).
#
#  == Y de ahi sale el reparto correcto, que es lo util ==
#
#      la TABLA dice   QUE instruccion, y como se llama en INTI
#      el CODIFICADOR dice   COMO se escribe con estos operandos
#
#  ** Separar esas dos cosas es lo que hace que otra maquina sea *otra tabla y
#  otro codificador*, sin tocar nada mas. Si los bytes vivieran mezclados con la
#  decision de que instruccion usar, portar seria reescribir el emisor entero en
#  vez de anadir una carpeta.
#
#  Hoy el codificador vive en `bmo_lower::x86` y lo comparten C, COBOL, Ada,
#  C++ e INTI. Es la pieza que **si** merece estar escrita en Rust, y la unica.

# ===================================================================
#  ** LAS FORTALEZAS DE ESTA MAQUINA, dichas para poder usarlas
# ===================================================================
#
#  Peticion de Eddi: *"en x86-64 vamos a expandir, pero MAS exclusivo para
#  x86-64, SU FORTALEZA"*. Estas son, y ninguna es "va rapido":
#
#  1. ** MODELO DE MEMORIA FUERTE (TSO). Las escrituras se ven en el orden en
#     que se hicieron. En ARM no, y por eso alli el mismo programa necesita
#     barreras que aqui sobran. Es la fortaleza mas real de x86-64 y la que
#     menos se nombra: **codigo compartido entre nucleos que aqui es correcto,
#     alli no lo es**, y el compilador tendra que meter las barreras al portar.
#
#  2. ATOMICAS de una instruccion. `lock cmpxchg` hace lo que en otras
#     arquitecturas son dos instrucciones y un bucle de reintento.
#
#  3. `cpuid`: la maquina se describe a si misma. No hace falta una tabla de
#     modelos ni adivinar por el nombre.
#
#  4. Instrucciones de cadena (`rep movsb`) que en el silicio moderno son el
#     camino rapido para copiar. OJO: **no siempre lo fueron** -- ver la seccion
#     13.10 del maestro, que es justo el ejemplo de que el ensamblador de ayer
