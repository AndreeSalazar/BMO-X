#  medidas.toml -- cuanto mide cada tipo, y como se alinea.
#
#  == Por que esto es una tabla, y no una `match` en el compilador ==
#
#  Porque la respuesta **depende de la maquina** en cuanto se sale de los tipos
#  con la medida en el nombre. `natural32` mide cuatro bytes en todas partes --lo
#  dice el nombre-- pero un puntero no, y `numero` tampoco.
#
#  ** Y hay una consecuencia que no es obvia: mientras la disposicion sea una
#  tabla, dos maquinas distintas pueden dar disposiciones distintas SIN QUE EL
#  COMPILADOR CAMBIE. El dia que INTI compile para 32 bits, lo que cambia es
#  `puntero = 4` en una tabla de esa maquina, no un fichero de Rust.
#
#  == La regla de alineacion, y por que es esta ==
#
#  Un tipo se alinea a su propia medida, y un registro a la del campo mas
#  exigente. No es la unica regla posible --se podria empaquetar todo sin
#  huecos-- pero es la que usan las ABI de verdad, y por eso es la que deja
#  hablar con lo que ya existe.
#
#  Un acceso desalineado en x86 funciona y va mas lento; en otras maquinas
#  **falla**. Esa es exactamente la clase de cosa que INTI promete no dejar al
#  azar.

[meta]
version = 1

# ===================================================================
#  Los que dicen su medida en el nombre
# ===================================================================
#
#  ** Estos no dependen de ninguna maquina, y ese es el motivo de que existan.
#  `perfil llano` los EXIGE (`E0020`) justamente por esto: sin medida no se
#  puede reservar en la pila ni elegir la instruccion.
[bytes]
natural8   = 1
natural16  = 2
natural32  = 4
natural64  = 8
entero8    = 1
entero16   = 2
entero32   = 4
entero64   = 8
flotante32 = 4
flotante64 = 8

#  `logico` mide un byte y no un bit: un bit no tiene direccion, y todo lo que
#  vive en un registro o en un campo tiene que poder tenerla.
logico     = 1

# ===================================================================
#  Los que dependen de la maquina
# ===================================================================
#
#  ** Estos estan aqui con el valor de hoy --64 bits-- y marcados. Cuando haya
#  una segunda maquina se mudan a `arch/<maquina>/inti.toml`, que es donde vive
#  todo lo que cambia con ella.
#
#  Se dejan aqui de momento en vez de adelantar la mudanza: mover un dato a un
#  sitio "por si acaso" antes de que exista el segundo caso es como se acaba con
#  tres tablas que dicen lo mismo.

#  ===================================================================
#   ** `numero`: LA DECISION DEL 2026-08-23, y por que esta fila importa
#  ===================================================================
#
#   Esta fila abre la puerta de `pleno` en `disposicion`, que llevaba cerrada
#   desde que ese modulo existe. Su comentario decia la condicion, y esta es.
#
#       numero  =  16     coeficiente entero64 + escala natural8 + 7 reservados
#
#   ** El coeficiente es de 64 bits y NO de 128, que es lo que el maestro dijo
#   durante meses. Lo decidio Eddi con una frase: *"INTI es un guiador al
#   Samurai CPU"*. Un `imul` de 64 bits ES una instruccion; uno de 128 es
#   software fingiendo serlo -- y meter eso en el tipo mas usado contradice la
#   tesis entera del lenguaje.
#
#   *** Y LA ESCALA VIAJA DENTRO, que es la diferencia con COBOL. Un
#   `PICTURE S9(7)V99` dice su escala AL COMPILAR, y por eso cabe en 4 bytes.
#   INTI escribe `x es numero` y ya --`1`, `2.5` y `0.1` son los tres `numero`--
#   asi que la escala no la sabe nadie hasta que hay un valor.
#
#   El precio, por delante: **~18 digitos significativos EN TOTAL**. Con escala
#   2 son 16 digitos enteros; con escala 6, doce. Es el mismo techo que tienen
#   los datos que el COBOL de al lado lee.
#
#   `decimal` es el mismo tipo con su nombre largo (10.3), asi que mide igual.
#   El dia que dejaran de medir lo mismo seria porque son dos tipos, y entonces
#   la linea que sobra es esta, no la de arriba.
[bytes_de_esta_maquina]
numero  = 16
decimal = 16
puntero = 8

#  Un `bufer de T` es una DIRECCION y nada mas: no lleva su longitud dentro.
#  Por eso indexarlo pide `crudo`, y por eso `lista de T` --que si la lleva-- es
#  de `pleno`. Dos tipos porque son dos promesas distintas, no por gusto.
bufer   = 8

#  ** LO QUE CRECE SE GUARDA POR REFERENCIA, no entero (2026-08-22).
#
#  Un `lista de T` o una `tabla` viven en el monton y lo que se guarda en una
#  variable --o en un campo-- es **donde estan**, no lo que son. Mide lo que un
#  puntero y no depende de cuantos elementos tenga.
#
#  *** Esta fila la predijo este mismo fichero, unas lineas mas abajo: *"el dia
#  que `pleno` tenga campos de `texto`, la fila que hace falta es
#  `referencia = 8` y no una medida para `texto`"*. Es esa fila.
#
#  ** Y es una fila aparte de `puntero` aunque hoy midan lo mismo, porque
#  contestan preguntas distintas: `puntero` es "una direccion cruda de esta
#  maquina" y `referencia` es "un objeto del monton, con su contador". El dia que
#  una referencia lleve algo mas --una etiqueta, un indice de tipo-- lo que
#  cambia es esta fila y no la de al lado.
referencia = 8

# ===================================================================
#  Lo que NO tiene medida, y es a proposito
# ===================================================================
#
#  ** Esta seccion tenia CINCO nombres y le quedan tres (2026-08-23):
#
#      texto  lista  tabla
#
#  `numero` y `decimal` se fueron arriba: ya tienen su disposicion decidida.
#  Los tres que quedan **no van a tener fila aqui nunca**, y por un motivo que
#  no es el mismo: CRECEN. Lo que crece no cabe en un campo de tamano fijo, asi
#  que lo que se guarda es su direccion y la fila que los mide es `referencia`.
#
#  *** Y su lista NO se copia aqui. Vive en `biblioteca.toml` como
#  `tipos_que_crecen`, la leen `perfil` y `disposicion`, y hay una prueba
#  --`texto_mide_una_referencia_porque_crece`-- que exige que este fichero siga
#  sin saber medir un `texto`. Si algun dia lo supiera, seria porque alguien
#  copio la lista.
#
#  [!] La prediccion que hizo esta seccion se cumplio: decia *"el dia que
#  `pleno` tenga campos de `texto`, la fila que hace falta es `referencia = 8` y
#  no una medida para `texto`"*. Fue esa fila, y nada mas que esa fila.

# ===================================================================
#  Que tipos se operan con la aritmetica de coma flotante
# ===================================================================
#
#  ** Esta seccion no dice cuanto mide nada: dice CON QUE SE OPERA. Esta aqui
#  porque es la otra mitad de la misma pregunta -- un tipo se define por lo que
#  mide y por lo que se le puede hacer, y separarlas en dos tablas seria pedir
#  que no discrepen nunca.
#
#  Y hace falta que sea un dato porque el descenso tiene que decidir si `a + b`
#  se baja a la aritmetica de enteros o a la de coma flotante, y esa decision
#  **no se puede tomar mirando los bits**: los ocho bytes de un `flotante64` y
#  los de un `natural64` son indistinguibles. Sale del tipo, y el tipo sale de
#  aqui.
#
#  ** Y lo que se gana teniendolo escrito: una maquina sin coma flotante deja
#  esta lista vacia, y entonces `a + b` de flotantes no compila en vez de
#  compilar a algo que el silicio no tiene. Hoy no hay ninguna asi; el dia que
#  la haya, el compilador no cambia.
[clase]
flotantes = ["flotante32", "flotante64"]

#  Y los que se operan con la aritmetica de enteros. La lista existe por
#  simetria y por una cosa mas: **las dos juntas son el catalogo de conversiones
#  que el lenguaje admite**. `flotante64(n)` y `entero32(f)` se escriben como
#  una llamada y no lo son -- son la instruccion `Convierte`, y el compilador
#  sabe cuales lo son porque estan aqui.
#
#  Si esto no fuera una tabla, anadir `entero128` el dia que exista obligaria a
#  tocar el descenso. Asi es una fila.
enteros = [
    "natural8", "natural16", "natural32", "natural64",
    "entero8", "entero16", "entero32", "entero64",
]

# ===================================================================
#  Lo que NO se alinea a su propia medida
# ===================================================================
#
#  Hasta el 2026-08-23 esta seccion no existia, y no por descuido: **todos los
#  tipos de antes median una potencia de dos y se alineaban a ella**, asi que
#  `alineacion_de` podia contestar con la medida y acertaba siempre.
#
#  `numero` rompe la coincidencia. Mide 16 porque lleva un `entero64` y un byte
#  de escala, pero **el campo mas exigente que tiene dentro pide 8**, no 16.
#  Alinearlo a 16 no seria incorrecto --sobra-- pero mentiria sobre el tipo, y
#  peor: meteria hasta 8 bytes de hueco delante de cada `numero` dentro de un
#  registro, sin que nadie pudiera ver por que.
#
#  ** La regla que estaba escondida dentro de la coincidencia, ahora escrita:
#  la alineacion de un tipo es la de su campo mas exigente, y solo coincide con
#  la medida cuando el tipo es UNA cosa.
[alineacion]
numero  = 8
decimal = 8
