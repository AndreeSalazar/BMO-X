#  modulos.toml -- que nombres trae cada `usa`.
#
#  == Las tres tablas, y por que son tres ==
#
#      comun.toml               lo que esta SIN PEDIRLO
#      modulos.toml (esta)      lo que trae `usa <modulo>`   <- REX
#      arch/<m>/inti.toml       lo que trae `usa <maquina>`  <- el metal
#
#  La linea que las separa es una sola pregunta: **lo escribe casi todo el
#  mundo?** Si si, va en `comun.toml`. Si lo escriben algunos, es un modulo y
#  hay que pedirlo. Y si ademas ata el fichero a una maquina, es una
#  arquitectura y pedirlo es declararlo.
#
#  == Lo que el compilador hace con esto ==
#
#  Saber que el nombre existe. Nada mas: los cuerpos estan en REX, que **trae el
#  cuerpo dentro** porque aqui no hay enlazado dinamico.
#
#  ** Y fijate en lo que NO cambia: `invoca` sigue sin ser palabra clave y sin
#  ser sintaxis. Es una fila de una tabla, como `outb`. La puerta del sistema
#  entra en INTI por el mismo sitio que entra una instruccion cualquiera.

[meta]
version = 1

#  La puerta: las dos llamadas congeladas del sistema.
#
#  No esta en `comun.toml` a proposito, aunque sea lo mas "de sistema" que hay:
#  **no todo programa habla con el kernel**, y uno que no lo hace no tiene por
#  que tener `invoca` ocupando un nombre.
[bmo]
invoca        = "haz esto AHORA sobre una capability; devuelve el codigo"
invoca_valor  = "la misma puerta, recogiendo el valor en vez del codigo"
espera_a      = "despiertame CUANDO pase esto"
mi_paquete    = "la capability de mi propio .bex, para leer sus recursos"

#  ** QUE RECOGE CADA UNO. No es una nota: el compilador lo lee.
#
#  La puerta de BMO-X contesta DOS cosas a la vez, por sitios distintos: un
#  CODIGO (0 = exito, y banderas del kernel en los bits altos) y un VALOR (un
#  handle, un puntero, un numero). La instruccion que se emite es la misma; lo
#  unico que cambia es de donde se lee la respuesta despues.
#
#  ** Esto vive aqui y no en la tabla de la maquina porque es del ABI de BMO-X:
#  que `invoca_valor` recoja el valor es verdad en toda maquina. DONDE esta ese
#  valor es lo que cambia, y eso si esta en `arch/<maquina>/inti.toml`.
#
#  Y sin esta seccion el fallo seria mudo: el emisor leeria el mismo registro
#  para los dos, `invoca_valor` devolveria el codigo, y todo puntero pedido al
#  kernel valdria cero -- que es indistinguible de un kernel que dice que no.
[recoge]
invoca        = "codigo"
invoca_valor  = "valor"
espera_a      = "codigo"
mi_paquete    = "valor"

# ===================================================================
#  ** LA MEMORIA -- leer y escribir una direccion
# ===================================================================
#
#  Sin esto, un programa de INTI puede pedirle un bloque al kernel y **no puede
#  tocarlo**. Que es exactamente donde estabamos: la puerta se abrio en F4a y al
#  otro lado no habia manos.
#
#  Es agnostico y no puede no serlo: toda maquina tiene memoria y toda maquina
#  sabe leer un byte. Lo que cambia por maquina es la instruccion, y eso lo
#  resuelve el emisor.
#
#  ** POR QUE PIDE `crudo`, con la misma regla de siempre:
#
#      al otro lado, hay alguien que comprueba?
#
#  De una direccion cruda, NO HAY NADIE. No hay kernel que valide una
#  capability como en `invoca`, y no hay comprobacion de limites como en un
#  indice de lista -- porque no hay lista: hay un numero. Escribir en la
#  direccion equivocada corrompe lo que hubiera alli y el programa sigue.
#
#  ** Y aqui esta la consecuencia bonita: el MONTON de `pleno` se va a escribir
#  en `llano`, y sus bloques `crudo` se van a CONTAR. El sitio donde nadie
#  comprueba por ti sale en el informe del .bex, con un numero, en vez de ser
#  una zona de confianza que nadie mira.
[memoria]
lee_natural8      = "el byte que hay en esa direccion"
lee_natural16     = "los dos bytes que hay en esa direccion"
lee_natural32     = "los cuatro bytes que hay en esa direccion"
lee_natural64     = "los ocho bytes que hay en esa direccion"
escribe_natural8  = "pon ese byte en esa direccion"
escribe_natural16 = "pon esos dos bytes en esa direccion"
escribe_natural32 = "pon esos cuatro bytes en esa direccion"
escribe_natural64 = "pon esos ocho bytes en esa direccion"

#  ** Los cuatro anchos estan. Los de 16 y 32 faltaron un dia, con el motivo
#  escrito: `bmo_lower` no traia los ayudantes, y escribirlos a mano dentro del
#  emisor de INTI habria puesto en un sitio lo que tiene que estar en el otro.
#
#  Se anadieron ALLI, no aqui. Y el de 32 es el que escribe un pixel en un
#  framebuffer, que era el motivo concreto para no dejarlo pendiente.

#  ** QUE HACE CADA UNO, en datos. El compilador lo lee.
#
#  `bytes` es el ancho, y esta en BYTES a proposito: "8" es verdad en toda
#  maquina, "qword" solo en una.
[accede]
lee_natural8      = { hace = "lee",     bytes = 1 }
lee_natural16     = { hace = "lee",     bytes = 2 }
lee_natural32     = { hace = "lee",     bytes = 4 }
lee_natural64     = { hace = "lee",     bytes = 8 }
escribe_natural8  = { hace = "escribe", bytes = 1 }
escribe_natural16 = { hace = "escribe", bytes = 2 }
escribe_natural32 = { hace = "escribe", bytes = 4 }
escribe_natural64 = { hace = "escribe", bytes = 8 }

# ===================================================================
#  Que pide `crudo` DE LO QUE TRAEN LOS MODULOS
# ===================================================================
#
#  ** Esta seccion afina una decision anterior, no la contradice.
#
#  `[crudo]` estuvo en `biblioteca.toml`, se mudo a `arch/<maquina>/inti.toml`
#  con este motivo escrito: *lo que exige `crudo` depende de la maquina*
#  (`entrada_puerto` existe en x86 y no en ARM).
#
#  Sigue siendo verdad, y la regla de verdad era mas general:
#
#      ** el `crudo` VIAJA CON QUIEN TRAE EL NOMBRE
#
#  La maquina trae `entrada_puerto` y trae su `crudo`. El modulo `memoria` trae
#  `escribe_natural64` y trae el suyo. Dos sitios porque hay dos fuentes de
#  nombres, no porque la regla sea distinta -- y asi un fichero sin `usa
#  memoria` no tiene que recordar que existe una prohibicion sobre un nombre
#  que no puede escribir.
[crudo]
piden = [
    "lee_natural8", "lee_natural16", "lee_natural32", "lee_natural64",
    "escribe_natural8", "escribe_natural16", "escribe_natural32",
    "escribe_natural64",
]

# ===================================================================
#  Constantes del ABI de BMO-X
# ===================================================================
#
#  Numeros que no son de ninguna maquina: son del sistema. Un programa que
#  escribiera `-2` donde va "mi propia tarea" compilaria igual y no se
#  entenderia nunca mas.
#
#  ** Van como TEXTO en hexadecimal porque un TOML guarda enteros con signo, y
#  `0xFFFFFFFFFFFFFFFE` no cabe en uno. Escribirlo como `-2` habria funcionado
#  y habria sido justo la mentira que esta seccion existe para no contar.
[constantes]
mi_tarea = "0xFFFFFFFFFFFFFFFE"

#  Las dos operaciones que el monton necesita. No estan todas las del kernel a
#  proposito: esta seccion crece cuando algo la usa, no antes. Una tabla llena
#  de numeros que nadie pide es una lista que nadie revisa.
op_pedir_memoria   = "0x15"
op_base_del_bloque = "0x01"

#  ** LA CONSOLA, que es el unico camino que un programa de `llano` tiene para
#  CONTAR algo.
#
#  En `llano` no hay `escribe`: formatear pide memoria. Lo unico que queda es la
#  puerta, y por ella caben OCHO BYTES por llamada, empaquetados y por valor.
#
#  Todo pasa por valor a proposito, y no es una limitacion temporal: es lo que
#  hace que Ring 0 no tenga que validar memoria ajena en la ruta de impresion.
#  El kernel corta en el primer byte cero.
#
#  Entra en la tabla hoy porque hoy la usa alguien --`cpu.inti`, la sonda del
#  Ryzen-- que es la regla que esta seccion se puso: crece cuando algo la pide,
#  no antes.
op_consola_escribir = "0x06"

#  ** LOS BITS -- el nombre es agnostico, la instruccion es de la maquina.
#
#  Peticion de Eddi (2026-08-19): *"una libreria de binarios literalmente, pero
#  usando su fortaleza para casos MUY ESPECIFICOS"*.
#
#  Y la forma correcta de hacerlo es esta, que no es obvia:
#
#      `cuenta_unos(x)` existe en TODAS las maquinas
#      en x86-64 es UNA instruccion (`popcnt`)
#      en una maquina sin ella son doce, y el programa sigue siendo el mismo
#
#  ** Por eso estos nombres viven aqui y no en `arch/x86_64/inti.toml`: lo que
#  va en la tabla de una maquina es lo que **solo existe alli** --puertos de
#  E/S, registros de control, tablas del sistema--. Contar bits no es de x86:
#  es de todas, y x86 resulta que lo hace rapido.
#
#  La diferencia se ve al portar: un programa que usa `usa binarios` se mueve; y
#  uno que usa `usa x86_64` declara que no.
#
#  ** Y hay un test que lo aprovecha: en x86-64, CADA operacion de esta lista
#  tiene una instruccion detras. Si algun dia una deja de tenerla, se sabra --
#  que es exactamente lo que hay que saber antes de escribir un bucle apretado.
[binarios]
cuenta_unos    = "cuantos bits estan a uno"
primer_uno     = "la posicion del bit mas bajo que esta a uno"
ultimo_uno     = "la del mas alto"
ceros_delante  = "cuantos ceros hay antes del primer uno, por arriba"
ceros_detras   = "cuantos hay despues, por abajo"
da_la_vuelta   = "invierte el orden de los bytes de un numero"

#  ** QUE MODULOS SE BAJAN A UNA INSTRUCCION, y no a una llamada.
#
#  Esta seccion existe por un fallo concreto: `cuenta_unos(x)` se bajaba a una
#  LLAMADA a un simbolo que no existe. Compilaba, pasaba el analisis de nombres
#  --el nombre esta en la tabla-- y el binario saltaba a la nada.
#
#  La causa no era el emisor: era que **nadie le decia al descenso que estos
#  nombres no son funciones**. Un modulo de REX trae funciones con cuerpo; este
#  trae los seis nombres de arriba, que en cada maquina son una instruccion o
#  doce, pero nunca un `call`.
#
#  ** Y por que es una FILA y no un `if nombre == "binarios"` dentro del
#  compilador: porque el dia que haya un segundo modulo asi --uno de atomicas,
#  por ejemplo-- lo que tiene que cambiar es este fichero.
[instrucciones]
son = ["binarios"]

[entrada]
espera_tecla  = "para hasta que se pulse una tecla, y la devuelve"
hay_tecla     = "hay algo pulsado sin esperar?"
raton         = "donde esta el raton y que botones tiene apretados"

[superficie]
mi_superficie = "la superficie donde dibuja esta app"
pinta         = "vuelca lo dibujado"
rectangulo    = "un rectangulo relleno"
linea         = "una linea de un punto a otro"
triangulo     = "un triangulo relleno"
texto_en      = "escribe un texto en una posicion"
limpia        = "deja la superficie de un solo color"

[archivo]
abre_para_leer    = "abre un fichero y devuelve por donde va"
abre_para_escribir = "lo mismo, para escribir"
lee_bloque        = "trae unos bytes a donde tu digas"
escribe_bloque    = "manda unos bytes"
cierra            = "suelta el fichero"

[paquete]
recurso       = "abre algo de dentro de mi propio .bex, sin cargarlo entero"
recursos      = "la lista de lo que hay dentro"

[sonido]
suena         = "un tono a una frecuencia y un tiempo"
calla         = "para el sonido"

#  == Lo que NO esta, y es una decision ==
#
#  `red`: bloqueada por el sistema, no por INTI. Entre `net rx` y algo que se
#  parezca a un socket estan ARP, IP, TCP, DNS y TLS.
#
#  Y no hay un `usa todo`. Un modulo que lo trae todo es una biblioteca comun
#  con otro nombre, y entonces la pregunta de arriba --lo escribe casi todo el
#  mundo?-- deja de tener respuesta.
