#  biblioteca.toml -- lo que el compilador tiene que saber de la biblioteca
#  base sin conocerla.
#
#  == Por que esto es una tabla ==
#
#  El analisis de perfiles necesita contestar dos preguntas:
#
#      1. este tipo, crece? (entonces pide monton, y en `llano` no hay)
#      2. este nombre, toca el metal? (entonces hay que escribirlo en `crudo`)
#
#  Las dos respuestas son DATOS sobre la biblioteca, no sobre el lenguaje. Si
#  vivieran en el compilador, anadir una operacion de sistema obligaria a
#  recompilar el compilador -- que es exactamente lo que `intrinsics.toml`
#  decidio no hacer nunca.
#
#  == La seccion `[crudo]` se MUDO ==
#
#  Estuvo aqui marcada como provisional durante unas horas, con el motivo
#  escrito: lo que exige `crudo` depende de la maquina (`entrada_puerto` existe
#  en x86 y no en ARM). Ya vive en `arch/<arquitectura>/inti.toml`, que es su
#  sitio.
#
#  ** Y de paso quedo mejor de lo que estaba: ahora `entrada_puerto` solo
#  EXISTE si el fichero escribio `usa x86_64`. Antes existia siempre y a veces
#  estaba prohibido, que es una regla mas que recordar.

[meta]
version = 1

# ===================================================================
#  Lo que el perfil `llano` NO admite
# ===================================================================
#
#  El criterio es uno solo: **crece**. Un `texto` al que se le pega otro texto
#  tiene que pedir memoria, y en `llano` no hay a quien pedirsela. No es una
#  lista de cosas prohibidas por gusto: es la consecuencia de no tener monton.
[llano]
tipos_que_crecen = ["texto", "lista", "tabla"]

#  `numero` es aparte y por otro motivo: no crece, pero **no dice su medida**.
#  Sin medida no se puede reservar en la pila ni elegir la instruccion, asi que
#  en `llano` hay que escribir `entero32`, `natural8`, etc.
tipos_sin_medida = ["numero", "decimal"]

# ===================================================================
#  ** QUE PERFILES LLEGAN A BYTES HOY
# ===================================================================
#
#  Esta fila existe por un fallo que se vio el 2026-08-22 corriendo la sonda del
#  Ryzen: un fichero con `perfil pleno` COMPILABA y salia un `.bex` de 768 bytes
#  que pasaba el gate. Y no hacia nada, porque `pleno` no esta construido:
#
#      `texto`, `lista` y `tabla` no existen -- no hay monton ni contador
#      `numero` es decimal exacto y se baja a un CERO
#      las llamadas a REX no tienen destino: no hay enlazado
#
#  ** Lo peor no era que no funcionara: era que el gate DIJERA QUE SI. Un `.bex`
#  firmado que devuelve ceros es exactamente lo que este proyecto persigue --
#  algo que compila y no hace lo que dice-- y encima con la firma detras.
#
#  ** Y esta en una TABLA y no en un `if` del compilador a proposito: el dia que
#  `pleno` baje a bytes, lo que cambia es esta linea. Un `if` habria que
#  encontrarlo; una fila se lee.
#
#  El aviso dice `todavia`, y hay una prueba que falla el dia que deje de ser
#  verdad -- para que la fila no se quede mintiendo al reves.
[bytes]
llegan = ["llano"]

# ===================================================================
#  Lo que NO esta aqui, y es a proposito
# ===================================================================
#
#  El catalogo completo de REX (`escribe`, `guarda`, `pinta`, `cuenta`...) no
#  vive en esta tabla. El compilador no necesita conocerlo para analizar
#  perfiles: le basta saber que crece y que no comprueba nadie.
#
#  Meter aqui la lista entera convertiria este fichero en una segunda
#  declaracion de la biblioteca, y dos declaraciones de la misma cosa acaban
#  discrepando. La biblioteca se declara en REX, en un sitio.
