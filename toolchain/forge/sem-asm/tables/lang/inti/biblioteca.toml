#  biblioteca.toml -- lo que el compilador tiene que saber de la biblioteca
#  base sin conocerla.
#
#  == Por que esto es una tabla ==
#
#  El analisis de perfiles necesita contestar dos preguntas:
#
#      1. este tipo, crece? (entonces pide monton, y en `llano` no hay)
#      2. este nombre, toca el metal? (entonces hay que escribirlo en `crudo`)
#
#  Las dos respuestas son DATOS sobre la biblioteca, no sobre el lenguaje. Si
#  vivieran en el compilador, anadir una operacion de sistema obligaria a
#  recompilar el compilador -- que es exactamente lo que `intrinsics.toml`
#  decidio no hacer nunca.
#
#  == La seccion `[crudo]` se MUDO ==
#
#  Estuvo aqui marcada como provisional durante unas horas, con el motivo
#  escrito: lo que exige `crudo` depende de la maquina (`entrada_puerto` existe
#  en x86 y no en ARM). Ya vive en `arch/<arquitectura>/inti.toml`, que es su
#  sitio.
#
#  ** Y de paso quedo mejor de lo que estaba: ahora `entrada_puerto` solo
#  EXISTE si el fichero escribio `usa x86_64`. Antes existia siempre y a veces
#  estaba prohibido, que es una regla mas que recordar.

[meta]
version = 1

# ===================================================================
#  Lo que el perfil `llano` NO admite
# ===================================================================
#
#  El criterio es uno solo: **crece**. Un `texto` al que se le pega otro texto
#  tiene que pedir memoria, y en `llano` no hay a quien pedirsela. No es una
#  lista de cosas prohibidas por gusto: es la consecuencia de no tener monton.
#
#  ** ESTA FILA TIENE DOS LECTORES DESDE EL 2026-08-23, y contesta dos preguntas.
#
#      perfil        crece? -> pide monton -> en `llano` no hay      (E0070)
#      disposicion   crece? -> se guarda por REFERENCIA -> mide 8
#
#  *** Son la misma fila a proposito, y no dos. Lo que crece no cabe en una
#  variable de tamano fijo; luego lo que cabe es su direccion. Es la MISMA
#  propiedad mirada desde dos sitios, asi que copiarla a `medidas.toml` --que
#  seria lo comodo-- solo compraria el dia en que las dos listas discrepen.
#
#  Por eso `texto` NO tiene fila en `medidas.toml` y aun asi mide: mide porque
#  esta AQUI. Hay una prueba que lo vigila por los dos lados
#  (`texto_mide_una_referencia_porque_crece`): exige que el plano diga 8 y que
#  la tabla de medidas siga diciendo que no sabe.
#
#  [!] Y `lista`/`tabla` estan en la lista por el perfil, no por la medida:
#  esas dos se saben por la FORMA del tipo (son variantes del arbol) y
#  `disposicion` no necesita preguntar aqui por ellas. `texto` es un nombre, y
#  un nombre solo se sabe consultando.
[llano]
tipos_que_crecen = ["texto", "lista", "tabla"]

#  Lo que no dice su medida. Hoy no hay nada: la lista se queda porque el dia
#  que aparezca un tipo asi, el sitio existe y el mensaje ya esta escrito.
tipos_sin_medida = []

# ===================================================================
#  ** Lo que `llano` no admite POR LO QUE CUESTA (2026-08-22)
# ===================================================================
#
#  `numero` estuvo hasta hoy en `tipos_sin_medida`, con este motivo escrito:
#  *"no crece, pero no dice su medida"*. **Y era falso.**
#
#  El maestro lo tiene decidido desde que se escribio, seccion 10.3:
#
#      entero    i64                            para contar
#      decimal   coeficiente 128b + escala      para dinero y para lo demas
#
#  Eso ES una medida. Lo que pasa con `numero` en `llano` no es que no se sepa
#  cuanto ocupa: es que **una suma decimal cuesta 5-20 veces una entera de 64
#  bits**, y `llano` es el perfil que escribe drivers y manejadores de
#  interrupciones.
#
#  *** Y la diferencia no es de matiz, es de mensaje. Un error que dice *"dime la
#  medida"* manda a buscar una medida que no falta. El que dice *"esto cuesta
#  esto, y aqui ese precio no se paga sin decirlo"* explica una decision.
#
#  Es la misma familia que `E0073`: distinguir **prohibido** de **no se hacerlo
#  todavia** de **cuesta y aqui no se paga** son tres cosas, y confundirlas es
#  lo que hace que un compilador parezca caprichoso.
tipos_que_cuestan = ["numero", "decimal"]

# ===================================================================
#  *** EL GATE ATOMICO: QUE PIEZAS BAJAN A BYTES (2026-08-23)
# ===================================================================
#
#  Aqui habia una lista de PERFILES: `llegan = ["llano"]`. Un nombre, y con el
#  se aceptaba o se rechazaba el programa entero.
#
#  ## Por que eso estaba mal, dicho por Eddi
#
#  > *"es como ir al aeropuerto: la maquina puede decir que no tienes armas, sin
#  > embargo tu cuerpo es un arma. Ese gate tiene que desarrollar algo mas
#  > atomico."*
#
#  El gate miraba el PASAPORTE, no lo que traes. Y fallaba en las dos
#  direcciones a la vez:
#
#      DE MAS   un `pleno` que solo usa `texto` y `lista` --que bajan enteros
#               desde hoy-- se rechazaba por culpa de `tabla`, que no toca
#
#      DE MENOS el dia que se abriera por perfil, un `pleno` que SI usa `tabla`
#               pasaria igual, con `tabla` devolviendo ceros
#
#  ** Un perfil es una etiqueta. Lo que decide si un binario hace lo que dice es
#  **que piezas usa y cuales sabe bajar el compilador**, y eso es esta tabla.
#
#  ## Y la otra mitad del gate no esta aqui: esta en `sin_emitir`
#
#  Una pieza que baja no basta. Una LLAMADA sin destino --un `call` a un simbolo
#  que no existe-- produce un binario que carga y salta a la nada, y eso ninguna
#  tabla de tipos lo ve. Por eso `main.rs` dejo de escribir el `.ibex` cuando
#  algo no llego a un byte: **son las manos desnudas del gate.**
#
#  ## Como se lee esta tabla
#
#  `true`  = el compilador sabe bajarla, y un programa que la use compila.
#  `false` = todavia no. Un programa que la use se rechaza CON SU NOMBRE, y uno
#            que no la toque compila aunque sea del mismo perfil.
#
#  ** El dia que una fila pase a `true`, lo que cambia es una fila.
[bytes.bajan]
#  El literal vive en `RoData` con el bit de INMORTAL, `a + b` llama a `junta`, y
#  el monton lo monta el arranque. Entero desde el 23-08.
texto = true
#  Literal, indice con Regla 2, `agrega` y `sitio_de`. Entero desde el 23-08.
lista = true
#  ** Entero desde el 23-08: disposicion (16 bytes, coeficiente + escala),
#  runtime (`runtime/decimal`) y descenso -- `a + b` llama a `suma`, que iguala
#  escalas subiendo. Y trajo consigo la primera LOCAL de mas de una palabra: un
#  `numero` no cabe en un registro, asi que el marco tuvo que aprender a repartir
#  por medida en vez de por cuenta.
numero = true
decimal = true
#  ** Ni forma, ni runtime, ni descenso. Es la unica de las cuatro que no ha
#  empezado.
tabla = false

# ===================================================================
#  Lo que NO esta aqui, y es a proposito
# ===================================================================
#
#  El catalogo completo de REX (`escribe`, `guarda`, `pinta`, `cuenta`...) no
#  vive en esta tabla. El compilador no necesita conocerlo para analizar
#  perfiles: le basta saber que crece y que no comprueba nadie.
#
#  Meter aqui la lista entera convertiria este fichero en una segunda
#  declaracion de la biblioteca, y dos declaraciones de la misma cosa acaban
#  discrepando. La biblioteca se declara en REX, en un sitio.
