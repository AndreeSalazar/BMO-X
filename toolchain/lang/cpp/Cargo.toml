[package]
name = "bmo-cpp-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "C++ frontend for BMO ABI — desazucara C++ sobre el AST de BMO C"

# ** Desde el 2026-09-18 el frontend no depende de nada que emita ni del ABI de
# x86-64: baja al arbol del FRONTEND de C y coloca con `bmo-disposicion`. Lo que
# emite vive en `emisor-x86_64/`. El guardian `isa` lo vigila.
[dependencies]
bmo-c-front = { path = "../c" }
bmo-disposicion = { path = "../disposicion" }

[lib]
name = "bmo_cpp_front"
path = "src/lib.rs"
