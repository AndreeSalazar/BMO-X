[package]
name = "bmo-cpp-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "C++ frontend for BMO ABI — desazucara C++ sobre el AST de BMO C"

[dependencies]
# forge: EL GATE. Ningun .bex se escribe sin pasar por aqui — es el
# "unico checkpoint comun" de la filosofia.
bmo-verify = { path = "../../forge/bmo-verify" }
bmo-abi = { path = "../../../platform/abi/bmo-abi" }
# ── LA HERENCIA ────────────────────────────────────────────────────────
# C++ hereda el DESCENSO de BMO C (`ast::Program` → BEF), NO su frontend.
# El lexer y el parser de C son `pub(crate)` y así se quedan: C++ escribe
# los suyos. La frontera es un TIPO DE DATOS —`bmo_c_front::ast::Program`—
# que es un formato, no un cerebro.
#
# La flecha apunta en UN SOLO SENTIDO: `lang/c/Cargo.toml` no menciona C++
# jamás, y la suite de C tiene que pasar entera con este crate fuera del
# workspace. El contrato completo, con las cuatro reglas de "no se
# combinan" y cuándo tocaría mudar el descenso a `forge/`, está en
# `toolchain/lang/cpp/HERENCIA.md`.
bmo-c-front = { path = "../c" }

[lib]
name = "bmo_cpp_front"
path = "src/lib.rs"

[[bin]]
name = "bmo-cpp-front"
path = "src/main.rs"

[dev-dependencies]
# Banco de pruebas: EJECUTA los bytes emitidos, no los mira. Mismo criterio
# que C y COBOL — un codegen roto se ve sanísimo en un volcado de bytes.
bmo-lower = { path = "../../forge/bmo-lower", features = ["emulator"] }
