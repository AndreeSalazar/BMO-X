[package]
name = "bmo-c-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "C frontend for BMO BMO ABI -- compiles minimal C to BEF"

[dependencies]
bmo-abi = { path = "../../../platform/abi/bmo-abi" }
# forge: encoder compartido (elegido, no embudo).
bmo-sem-asm = { path = "../../forge/sem-asm" }
# forge: L1, la puerta al ABI (INVOKE/subsyscalls). Elegida, no embudo.
bmo-lower = { path = "../../forge/bmo-lower" }
# forge: el contrato de tablas y manifiestos. Sustituye a los dos lectores
# de TOML hechos a mano que habia en standard.rs y module.rs.
bmo-mods = { path = "../../forge/bmo-mods" }
# forge: EL GATE. Ningun `.bex` se escribe sin pasar por aqui. Es el "unico
# checkpoint comun" de la filosofia -- el papel de seguridad que tendria un IR
# central, pero como CONTRATO: cada lenguaje emite lo suyo y esto lo revisa.
bmo-verify = { path = "../../forge/bmo-verify" }


[lib]
name = "bmo_c_front"
path = "src/lib.rs"

[[bin]]
name = "bmo-c-front"
path = "src/main.rs"

[dev-dependencies]
# Banco de pruebas: ejecuta el codigo emitido (ver forge/bmo-lower).
bmo-lower = { path = "../../forge/bmo-lower", features = ["emulator"] }
