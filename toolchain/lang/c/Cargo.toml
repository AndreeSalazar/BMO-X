[package]
name = "bmo-c-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO C: el FRONTEND (preprocesador, parser, arbol, tipos). No nombra una maquina."

# ** Desde el 2026-09-18 el frontend no depende de nada que emita ni del ABI de
# x86-64: lo que emite vive en `emisor-x86_64/`. El guardian `isa` lo vigila.
[dependencies]
# forge: el contrato de tablas y manifiestos. Sustituye a los dos lectores
# de TOML hechos a mano que habia en standard.rs y module.rs.
bmo-mods = { path = "../../forge/bmo-mods" }
# La regla de disposicion de un struct: UNA, compartida con el codegen, el
# parser de C++ y el ABI. Salio de bmo-abi para poder estar aqui.
bmo-disposicion = { path = "../disposicion" }

[lib]
name = "bmo_c_front"
path = "src/lib.rs"
