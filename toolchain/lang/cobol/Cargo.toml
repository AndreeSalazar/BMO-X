[package]
name = "bmo-cobol-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO COBOL frontend — parses COBOL and compiles native BEX executables"

[dependencies]
bmo-abi = { path = "../../../platform/abi/bmo-abi" }
# forge: encoder compartido (elegido, no embudo) — sustituye el hardcodeo
# de bytes (mov imm64/reg, syscall) por la tabla TOML.
bmo-sem-asm = { path = "../../forge/sem-asm" }
# forge: L1, la puerta al ABI (INVOKE/subsyscalls). Elegida, no embudo.
bmo-lower = { path = "../../forge/bmo-lower" }

# NOTA: gnucobol-rs (GPL) ELIMINADO — la PIC ahora la parsea nuestro propio
# src/pic.rs. El submódulo extern/gnucobol-rs queda solo como oráculo de
# validación cruzada, jamás enlazado. COBOL 100% BMO.

[lib]
name = "bmo_cobol_front"
path = "src/lib.rs"

[[bin]]
name = "bmo-cobol-front"
path = "src/main.rs"

[dev-dependencies]
# El banco de pruebas: ejecuta el codigo emitido en vez de mirarlo.
# Un IF que no bifurca se ve igual que uno que si en un volcado de
# bytes; solo se distinguen corriendolos.
bmo-lower = { path = "../../forge/bmo-lower", features = ["emulator"] }
