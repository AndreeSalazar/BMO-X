[package]
name = "bmo-ada-front"
version = "0.1.0"
edition = "2021"
authors = ["BMO Project"]
description = "BMO Ada: el FRONTEND (lexer, analisis, arbol). No nombra una maquina."

# -- Lo que enlaza, y lo que NO -----------------------------------
#
# NO depende de `bmo-cobol-front`, y es una decision, no un descuido: cada
# lenguaje es un pipeline individual y completo (regla 2 del proyecto --
# "contratos y formatos, NUNCA cerebros"). Ada mantiene su esencia de principio
# a fin, con su propio lexer, su propio analisis y su propio emisor.
#
# Lo unico compartido son CONTRATOS y librerias OPCIONALES que el frontend
# elige enlazar:
#   bmo-abi     el contenedor BEF y la superficie congelada de 2 syscalls
#   bmo-lower   L1, la puerta al ABI (consola, formateo, archivos)
#
# El dia que Ada necesite el `PICTURE` de Annex F --que el estandar copio de
# COBOL-- la salida NO es importar `lang/cobol`: es promover ese motor a
# `forge/` como libreria opcional que los dos elijan enlazar.

# ** SIN dependencias (2026-09-18). El frontend no sabe de CPU, ni de BEF, ni
# del gate: todo eso es de quien EMITE, en `emisor-x86_64/`. Si algun dia hace
# falta una dependencia aqui, que no sea de x86-64: el guardian `isa` lo mira.
[dependencies]

[lib]
name = "bmo_ada_front"
path = "src/lib.rs"
