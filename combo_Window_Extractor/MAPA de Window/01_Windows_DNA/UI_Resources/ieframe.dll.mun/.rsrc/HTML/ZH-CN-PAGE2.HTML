<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles_ltr.css" />

    <script src="jquery-1.11.3.min.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>

    <title>Internet Explorer 11</title>
</head>
<body>

    <div class="header">
        <div class="ie-logo"></div>
        <div class="heading"><p>选择主页和搜索设置</p></div>
    </div>

    <div class="intro-row">
        <div>
            <p>从现在起，Internet Explorer 将阻止网站无提示地更改这些设置。选择你想要保留的设置。</p>
            <div><a href="#" class="intro-learnmore">单击此处了解详细信息。</a></div>
        </div>
    </div>

    <div class="settings-row">
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-default" checked />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-default">Microsoft 设置</label>:</p>
                <p>主页: <span dir="ltr" class="settingValue defaultDHP"></span></p>
                <p>默认搜索引擎: <span dir="ltr" class="settingValue defaultDSP"></span></p>
            </div>
        </div>
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-current" />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-current">你的当前设置</label>:</p>
                <p>主页: <span dir="ltr" class="settingValue currentDHP"></span></p>
                <p>默认搜索引擎: <span dir="ltr" class="settingValue currentDSP"></span></p>
            </div>
        </div>
    </div>

    <div class="cta-row">
        <div class="cta-button cta-return-selected">
            <div class="cta-button-text">
                <p>完成</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>你始终可以在以后通过 Internet Explorer 中的“工具”<strong></strong>菜单更改这些设置。</p>
    </div>

</body>
</html>
