<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles_ltr.css" />

    <script src="jquery-1.11.3.min.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>

    <title>Internet Explorer 11</title>
</head>
<body>

    <div class="header">
        <div class="ie-logo"></div>
        <div class="heading"><p>ホーム ページと検索設定の選択</p></div>
    </div>

    <div class="intro-row">
        <div>
            <p>今後、Internet Explorer はこれらの設定が Web サイトによって通知なく変更されることを防ぎます。維持する設定を選択してください。</p>
            <div><a href="#" class="intro-learnmore">詳細については、ここをクリックしてください。</a></div>
        </div>
    </div>

    <div class="settings-row">
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-default" checked />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-default">Microsoft の設定</label>:</p>
                <p>ホーム ページ: <span dir="ltr" class="settingValue defaultDHP"></span></p>
                <p>既定の検索エンジン: <span dir="ltr" class="settingValue defaultDSP"></span></p>
            </div>
        </div>
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-current" />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-current">現在の設定</label>:</p>
                <p>ホーム ページ: <span dir="ltr" class="settingValue currentDHP"></span></p>
                <p>既定の検索エンジン: <span dir="ltr" class="settingValue currentDSP"></span></p>
            </div>
        </div>
    </div>

    <div class="cta-row">
        <div class="cta-button cta-return-selected">
            <div class="cta-button-text">
                <p>完了</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>これらの設定は、Internet Explorer の [<strong>ツール</strong>] メニューからいつでも変更できます。</p>
    </div>

</body>
</html>
