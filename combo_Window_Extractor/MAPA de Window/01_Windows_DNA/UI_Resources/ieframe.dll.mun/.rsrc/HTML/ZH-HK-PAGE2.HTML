<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles_ltr.css" />

    <script src="jquery-1.11.3.min.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>

    <title>Internet Explorer 11</title>
</head>
<body>

    <div class="header">
        <div class="ie-logo"></div>
        <div class="heading"><p>選擇您的首頁與搜尋設定</p></div>
    </div>

    <div class="intro-row">
        <div>
            <p>從現在開始，Internet Explorer 將禁止網站擅自變更這些設定。請選擇您要保留的設定。</p>
            <div><a href="#" class="intro-learnmore">按一下此處以深入了解。</a></div>
        </div>
    </div>

    <div class="settings-row">
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-default" checked />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-default">Microsoft 設定</label>:</p>
                <p>首頁：<span dir="ltr" class="settingValue defaultDHP"></span></p>
                <p>預設搜尋引擎：<span dir="ltr" class="settingValue defaultDSP"></span></p>
            </div>
        </div>
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-current" />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-current">您的目前設定</label>:</p>
                <p>首頁：<span dir="ltr" class="settingValue currentDHP"></span></p>
                <p>預設搜尋引擎：<span dir="ltr" class="settingValue currentDSP"></span></p>
            </div>
        </div>
    </div>

    <div class="cta-row">
        <div class="cta-button cta-return-selected">
            <div class="cta-button-text">
                <p>完成</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>您之後可以在 Internet Explorer 的 [工具]<strong></strong> 功能表中，隨時變更這些設定。</p>
    </div>

</body>
</html>
