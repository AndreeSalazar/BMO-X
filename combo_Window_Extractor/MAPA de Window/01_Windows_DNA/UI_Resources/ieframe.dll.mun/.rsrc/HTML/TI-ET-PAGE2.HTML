<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles_ltr.css" />

    <script src="jquery-1.11.3.min.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>

    <title>Internet Explorer 11</title>
</head>
<body>

    <div class="header">
        <div class="ie-logo"></div>
        <div class="heading"><p>መበገሲ ገጽካ ምረጽ እሞ ኣቀማምጣታት ድለይ</p></div>
    </div>

    <div class="intro-row">
        <div>
            <p>ካብ ሕጂ ንደሓር፣ Internet Explorer መርበባት ሓበሬታ ነዞም ኣቀማምጣታት ብጸጥታ ካብ ምቕያር ደው ከብሎም እዩ። ከተጽንሖም እትደልዮም ኣቀማምጣታት ምረጽ።</p>
            <div><a href="#" class="intro-learnmore">ንዝያዳ ሓበሬታ ኣብዚ ጠውቑ.</a></div>
        </div>
    </div>

    <div class="settings-row">
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-default" checked />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-default">Microsoft ኣቀማምጣታት</label>:</p>
                <p>መበገሲ ገጽ: <span dir="ltr" class="settingValue defaultDHP"></span></p>
                <p>ንቡር ናይ ኣለሻ ሞተር: <span dir="ltr" class="settingValue defaultDSP"></span></p>
            </div>
        </div>
        <div class="setting-item">
            <div class="setting-item-radio">
                <input type="radio" class="setting-radio" name="setting-radio" id="radio-current" />
            </div>
            <div class="setting-item-content">
                <p><label for="radio-current">ናይ ሕጂ ኣቀማምጣታትካ</label>:</p>
                <p>መበገሲ ገጽ: <span dir="ltr" class="settingValue currentDHP"></span></p>
                <p>ንቡር ናይ ኣለሻ ሞተር: <span dir="ltr" class="settingValue currentDSP"></span></p>
            </div>
        </div>
    </div>

    <div class="cta-row">
        <div class="cta-button cta-return-selected">
            <div class="cta-button-text">
                <p>ተሰሪሑ</p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>ኩሉግዜ እዞም ኣቀማምጣታት ካብቲ   Internet Explorer ናይ <strong>መሳርሒታት</strong> መምረጺ ክትቅይሮም ትኽእል ኢኻ።</p>
    </div>

</body>
</html>
