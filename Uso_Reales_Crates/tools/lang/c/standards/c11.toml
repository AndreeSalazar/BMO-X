# C11 — ISO/IEC 9899:2011
# Committee: ISO JTC1/SC22/WG14
# Adopted: 2011-12-08

[standard]
name = "C11"
iso = "9899:2011"
year = 2011

[features]
function_prototypes = true
void_type = true
structs = true
unions = true
enums = true
typedefs = true
pointers = true
arrays = true
const = true
volatile = true

preprocessor = true
inline = true
restrict = true
long_long = true

# C11 additions
_Alignas = false
_Alignof = false
_Atomic = false
_Generic = false
_Noreturn = false
_Static_assert = false
_Thread_local = false
anonymous_structs = false
anonymous_unions = false
bounds_checking = false
multi_threading = false
type_generic_math = false
unicode = false

[comments]
block = true
line = true

[types]
void = true
char = true
short = true
int = true
long = true
long_long = true
float = true
double = true
unsigned = true
signed = true
_Bool = true

[license]
text = "Public Domain — ISO standard"
