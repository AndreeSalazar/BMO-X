[package]
name = "bmo-arch"
version = "0.1.0"
edition = "2021"
description = "BMO platform — the agnostic intermediary between Ring 0 and Ring 3. x86-64 today, any CPU tomorrow."
license = "MIT"

# ── Library type ─────────────────────────────────────────────────
# The platform crate is a `no_std` library used by both Ring 0 and Ring 3.
# It must compile in both contexts (so no allocation, no_std-only).
# When `bmo-arch` is built for x86_64-unknown-none, the right arch
# module is selected at compile time via `target_arch` cfg.
[lib]
path = "src/lib.rs"

# ── Features ─────────────────────────────────────────────────────
# `arch-x86_64` is the default and the only active arch for now.
# Future: `arch-aarch64`, `arch-riscv64`. They are mutually exclusive.
[features]
default = ["arch-x86_64"]
arch-x86_64 = []
# arch-aarch64 = []
# arch-riscv64 = []

# ── Dependencies ─────────────────────────────────────────────────
# bmo-channel: the lock-free ring buffer IPC primitive (one page, atomic).
# bmo-abi:     the syscall IDs and type definitions (CPU-agnostic).
# boot-context: the BootContext struct passed from the kernel to userland.
#               Used by `runtime::boot` to discover the hardware address
#               map and channel locations.
[dependencies]
bmo-channel  = { path = "../platform/shared/bmo-channel" }
bmo-abi      = { path = "../platform/abi/bmo-abi" }
boot-context = { path = "../Ultra_kernel_x86-64/boot_context" }

# ── Profile ──────────────────────────────────────────────────────
# Platform code is on every boot path and every syscall entry. Keep it
# small and fast.
[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
